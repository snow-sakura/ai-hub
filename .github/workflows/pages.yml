name: Deploy Demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-hub/demo/**'
      - 'ai-hub/docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 未启用时 deploy 链必失败；用 GITHUB_TOKEN（pages:write 权限）幂等启用并切到 Actions 源
      - name: Ensure GitHub Pages is enabled (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pages")
          echo "GET /pages -> $code"
          if [ "$code" = "404" ]; then
            echo "Pages 未启用，POST CREATE (build_type=workflow)..."
            gh api "repos/$REPO/pages" --method POST -f build_type=workflow -q '.html_url'
          elif [ "$code" = "200" ]; then
            src=$(gh api "repos/$REPO/pages" -q .build_type)
            echo "当前源: $src"
            if [ "$src" != "workflow" ]; then
              echo "切换为 workflow 源..."
              gh api "repos/$REPO/pages" --method PUT -f build_type=workflow -q '.html_url'
            fi
          else
            echo "意外状态码 $code，交由 configure-pages 处理"
          fi

      - name: Build demo site (copy screenshots + data into demo/)
        run: node ai-hub/demo/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-hub/demo
      - id: deployment
        uses: actions/deploy-pages@v4
