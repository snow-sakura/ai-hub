name: Deploy Demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-hub/demo/**'
      - 'ai-hub/docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # 调试渠道：Pages API 失败时公开错误详情（公开仓库匿名可读）

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages 未启用时 deploy 链必失败；用 GITHUB_TOKEN（pages:write 权限）幂等启用并切到 Actions 源
      - name: Ensure GitHub Pages is enabled (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/pages")
          echo "GET /pages -> $code"
          dbg() {
            # 失败诊断：发布到 issue（可匿名查看），随后仍让流程继续尝试 configure-pages
            gh api "repos/$REPO/issues" \
              -f title="[pages-debug] code=$code" \
              -f "body=GET status: $code | build_type src: ${src:-N/A} | api output: $1" \
              -q .html_url || true
          }
          if [ "$code" = "404" ]; then
            echo "Pages 未启用，POST CREATE (build_type=workflow)..."
            out=$(gh api "repos/$REPO/pages" --method POST -f build_type=workflow -q '.html_url' 2>&1) || { echo "ENABLE-FAIL: $out"; dbg "$out"; }
            echo "RESULT: $out"
          elif [ "$code" = "200" ]; then
            src=$(gh api "repos/$REPO/pages" -q .build_type)
            echo "当前源: $src"
            if [ "$src" != "workflow" ]; then
              out=$(gh api "repos/$REPO/pages" --method PUT -f build_type=workflow -q '.html_url' 2>&1) || { echo "SWITCH-FAIL: $out"; dbg "$out"; }
              echo "RESULT: $out"
            fi
          else
            dbg "unexpected GET status $code"
          fi

      - name: Build demo site (copy screenshots + data into demo/)
        run: node ai-hub/demo/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-hub/demo
      - id: deployment
        uses: actions/deploy-pages@v4
