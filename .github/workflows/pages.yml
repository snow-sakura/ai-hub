name: Deploy Demo Pages

# 发布机制说明：
#   站点由 gh-pages 分支（根目录）自动发布（Pages 已启用，build_type=legacy/branch）。
#   workflow 职责：把最新截图+数据快照构建进站点并强推 gh-pages 分支，
#   GitHub 检测到分支新提交后自动重新发布 —— 全程仅需 GITHUB_TOKEN（contents:write），
#   不依赖任何无法自动化的操作（GitHub 禁止 GITHUB_TOKEN 创建/切换 Pages 源）。
on:
  push:
    branches: [main]
    paths:
      - 'ai-hub/demo/**'
      - 'ai-hub/docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # 允许推送 gh-pages 分支

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build demo site (screenshots + data → demo/)
        run: node ai-hub/demo/build.mjs

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd ai-hub/demo
          rm -rf _site && mkdir _site && cd _site
          git init -q -b gh-pages
          cp -r ../index.html ../assets ../data .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site: ${SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/gh-pages
          echo "已发布：https://${GITHUB_REPOSITORY_OWNER}.github.io/ai-hub/ （分支新提交触发自动重发布）"
