<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>测试管理 - AI-HUB</title>
<style>
  :root {
    --primary:#C67B5C; --primary-light:#D49472; --accent:#D4A574;
    --bg:#FBF7F0; --card-bg:#FFFDF9; --sidebar-bg:#F6F0E7;
    --text:#3D2E1F; --text-secondary:#5C4A38; --text-muted:#8B7355;
    --border:1px solid rgba(180,150,120,0.12);
    --radius:8px; --radius-lg:12px;
    --font: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
  .sidebar { width:220px; background:var(--sidebar-bg); border-right:var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
  .sidebar-logo { display:flex; align-items:center; gap:10px; padding:20px 20px 16px; border-bottom:var(--border); }
  .sidebar-logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--primary),var(--accent)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; }
  .sidebar-logo-text { font-size:18px; font-weight:700; }
  .sidebar-nav { flex:1; padding:12px 10px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius); cursor:pointer; color:var(--text-secondary); font-size:14px; transition:all 0.2s; margin-bottom:2px; }
  .nav-item svg { width:18px; height:18px; flex-shrink:0; }
  .nav-item:hover { background:rgba(198,123,92,0.06); color:var(--text); }
  .nav-item.active { background:rgba(198,123,92,0.1); color:var(--primary); font-weight:600; }
  .nav-section { font-size:11px; color:var(--text-muted); padding:16px 12px 6px; text-transform:uppercase; letter-spacing:1px; }
  .sidebar-user { padding:16px 20px; border-top:var(--border); display:flex; align-items:center; gap:10px; cursor:pointer; }
  .sidebar-user-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary-light),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; }
  .sidebar-user-name { font-size:13px; font-weight:500; }
  .sidebar-user-role { font-size:11px; color:var(--text-muted); }
  .content { flex:1; padding:28px 32px; overflow-y:auto; max-width:calc(100vw - 220px); }
  /* 模块头部 */
  .module-header { margin-bottom:28px; }
  .page-header-breadcrumb { font-size:13px; color:var(--text-muted); margin-bottom:8px; }
  .page-header-breadcrumb a { color:var(--primary); text-decoration:none; }
  .module-title { font-size:26px; font-weight:700; display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .module-title-icon { width:40px; height:40px; background:linear-gradient(135deg,var(--primary),var(--accent)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .module-title-icon svg { width:20px; height:20px; }
  .module-desc { color:var(--text-muted); font-size:15px; line-height:1.6; max-width:600px; }
  /* 统计概览 */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .stat-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:18px 20px; border:var(--border); display:flex; align-items:center; gap:14px; transition:all 0.25s; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(180,150,120,0.08); }
  .stat-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stat-icon svg { width:20px; height:20px; }
  .stat-body { flex:1; }
  .stat-number { font-size:22px; font-weight:700; line-height:1.2; }
  .stat-label { font-size:12px; color:var(--text-muted); margin-top:2px; }
  /* 子功能卡片 */
  .sub-title { font-size:17px; font-weight:600; color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .sub-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .feature-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:24px; border:var(--border); cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; }
  .feature-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,var(--primary),var(--accent)); opacity:0; transition:opacity 0.3s; }
  .feature-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(180,150,120,0.1); }
  .feature-card:hover::before { opacity:1; }
  .feature-card-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .feature-card-icon svg { width:22px; height:22px; }
  .feature-card h3 { font-size:16px; font-weight:600; margin-bottom:6px; color:var(--text); }
  .feature-card p { font-size:13px; color:var(--text-muted); line-height:1.6; }
  .feature-card-meta { display:flex; align-items:center; gap:12px; margin-top:12px; font-size:12px; color:var(--text-muted); }
  .feature-card-meta span { display:flex; align-items:center; gap:4px; }
  /* 底部 */
  .footer { text-align:center; padding:24px; color:var(--text-muted); font-size:13px; border-top:var(--border); margin-top:32px; }
  @media(max-width:900px){ .stats { grid-template-columns:repeat(2,1fr); } .feature-grid { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:768px){ .sidebar { width:60px; } .sidebar-logo-text,.sidebar-user-name,.sidebar-user-role,.nav-item span,.nav-section { display:none; } .sidebar-logo{justify-content:center;padding:16px 8px;} .nav-item{justify-content:center;padding:10px;} .sidebar-user{justify-content:center;padding:12px;} .content{padding:20px 16px;max-width:calc(100vw - 60px);} .stats{grid-template-columns:1fr;} .feature-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">AI</div><span class="sidebar-logo-text">AI-HUB</span></div>
  <div class="sidebar-nav">
    <div class="nav-item" onclick="location.href='../../00-首页仪表盘/首页仪表盘.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>首页</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V12a2 2 0 01-2 2h-1v2"/><circle cx="12" cy="22" r="2"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/><path d="M12 6v2m-3 0a3 3 0 00-3 3v6"/></svg><span>AI智能测试</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14M7 3v3M17 3v3"/><rect x="3" y="10" width="18" height="4" rx="1"/></svg><span>API接口测试</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>UI自动化</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><span>APP自动化</span></div>
    <div class="nav-section">核心模块</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><span>测试管理</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>配置中心</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>AI聊天室</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>知识库</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>系统管理</span></div>
  </div>
  <div class="sidebar-user"><div class="sidebar-user-avatar">张</div><div><div class="sidebar-user-name">张三</div><div class="sidebar-user-role">管理员</div></div></div>
</div>

<div class="content">
  <!-- 模块头部 -->
  <div class="module-header">
    <div class="page-header-breadcrumb"><a href="../../00-首页仪表盘/首页仪表盘.html">首页</a> / 测试管理</div>
    <div class="module-title">
      <div class="module-title-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      </div>
      测试管理
    </div>
    <div class="module-desc">
      集中管理测试项目、版本、团队成员和用例评审，提供全流程的测试管理能力，确保测试工作高效有序推进。
    </div>
  </div>

  <!-- 统计概览 -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(198,123,92,0.12);color:var(--primary)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">24</div>
        <div class="stat-label">进行中项目</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(212,165,116,0.12);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">16</div>
        <div class="stat-label">活跃版本</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(198,123,92,0.12);color:var(--primary)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">42</div>
        <div class="stat-label">团队成员</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(212,165,116,0.12);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">8</div>
        <div class="stat-label">待处理评审</div>
      </div>
    </div>
  </div>

  <!-- 子功能卡片 -->
  <div class="sub-title">功能模块</div>
  <div class="feature-grid" id="featureGrid"></div>

  <div class="footer">AI-HUB 智能测试平台 &copy; 2025</div>
</div>

<script>
  const features = [
    { name:'项目管理', desc:'创建和管理测试项目，分配负责人，设置项目时间节点，实时跟踪项目进度状态。', subs:'8个进行中', icon:'folder', color:'#C67B5C', link:'项目管理.html' },
    { name:'版本管理', desc:'管理测试版本发布周期，记录版本变更日志，跟踪各版本测试进度与质量指标。', subs:'16个版本', icon:'tag', color:'#D4A574', link:'版本管理.html' },
    { name:'成员管理', desc:'管理测试团队成员信息，分配角色权限，查看成员在线状态与工作负载情况。', subs:'42名成员', icon:'users', color:'#C67B5C', link:'成员管理.html' },
    { name:'用例评审', desc:'组织用例评审会议，跟踪评审状态，管理评审意见与修改反馈，确保用例质量。', subs:'8个待评审', icon:'checklist', color:'#D4A574', link:'用例评审.html' },
    { name:'数据看板', desc:'提供测试管理全景数据可视化，展示项目进度、版本趋势、团队效能等关键指标。', subs:'实时数据', icon:'chart', color:'#C67B5C', link:'#' },
  ];
  const featIcons = {
    folder:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>`,
    tag:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
    users:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,
    checklist:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>`,
    chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
  };
  function renderFeatures(){
    const grid=document.getElementById('featureGrid');
    features.forEach(f=>{
      const card=document.createElement('div'); card.className='feature-card';
      card.innerHTML=\`
        <div class="feature-card-icon" style="background:\${f.color}18;color:\${f.color}">\${featIcons[f.icon]}</div>
        <h3>\${f.name}</h3>
        <p>\${f.desc}</p>
        <div class="feature-card-meta"><span>\${f.subs}</span></div>
      \`;
      card.addEventListener('click',()=>{
        if(f.link!=='#') window.location.href=f.link;
        else alert('数据看板模块开发中');
      });
      grid.appendChild(card);
    });
  }
  renderFeatures();
</script>
</body>
</html>
