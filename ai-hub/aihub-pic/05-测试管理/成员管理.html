<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>成员管理 - AI-HUB</title>
<style>
  :root {
    --primary:#C67B5C; --primary-light:#D49472; --accent:#D4A574;
    --bg:#FBF7F0; --card-bg:#FFFDF9; --sidebar-bg:#F6F0E7;
    --text:#3D2E1F; --text-secondary:#5C4A38; --text-muted:#8B7355;
    --border:1px solid rgba(180,150,120,0.12);
    --radius:8px; --radius-lg:12px;
    --font: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
  /* 侧边栏公用 */
  .sidebar { width:220px; background:var(--sidebar-bg); border-right:var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; flex-shrink:0; }
  .sidebar-logo { display:flex; align-items:center; gap:10px; padding:20px 20px 16px; border-bottom:var(--border); }
  .sidebar-logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--primary),var(--accent)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:16px; }
  .sidebar-logo-text { font-size:18px; font-weight:700; }
  .sidebar-nav { flex:1; padding:12px 10px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius); cursor:pointer; color:var(--text-secondary); font-size:14px; transition:all 0.2s; margin-bottom:2px; }
  .nav-item svg { width:18px; height:18px; flex-shrink:0; }
  .nav-item:hover { background:rgba(198,123,92,0.06); color:var(--text); }
  .nav-item.active { background:rgba(198,123,92,0.1); color:var(--primary); font-weight:600; }
  .nav-section { font-size:11px; color:var(--text-muted); padding:16px 12px 6px; text-transform:uppercase; letter-spacing:1px; }
  .sidebar-user { padding:16px 20px; border-top:var(--border); display:flex; align-items:center; gap:10px; cursor:pointer; }
  .sidebar-user-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary-light),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; }
  .sidebar-user-name { font-size:13px; font-weight:500; }
  .sidebar-user-role { font-size:11px; color:var(--text-muted); }

  .content { flex:1; padding:28px 32px; overflow-y:auto; max-width:calc(100vw - 220px); }
  .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .page-header h1 { font-size:22px; font-weight:700; }
  .page-header-breadcrumb { font-size:13px; color:var(--text-muted); margin-bottom:4px; }
  .page-header-breadcrumb a { color:var(--primary); text-decoration:none; }
  .btn { padding:8px 20px; border-radius:var(--radius); border:none; cursor:pointer; font-size:14px; font-weight:500; transition:all 0.2s; font-family:var(--font); display:inline-flex; align-items:center; gap:6px; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-light); }
  .btn-outline { background:transparent; border:1px solid rgba(180,150,120,0.25); color:var(--text-secondary); }
  .btn-outline:hover { border-color:var(--primary); color:var(--primary); }
  .btn-sm { padding:4px 12px; font-size:12px; }

  /* 子导航 */
  .sub-nav { display:flex; gap:4px; padding:12px 0 16px; flex-wrap:wrap; }
  .sub-nav-item { padding:6px 16px; border-radius:20px; font-size:13px; cursor:pointer; color:var(--text-secondary); background:transparent; transition:all 0.2s; text-decoration:none; }
  .sub-nav-item:hover { background:rgba(198,123,92,0.06); color:var(--text); }
  .sub-nav-item.active { background:var(--primary); color:#fff; }

  /* 搜索过滤 */
  .filter-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .search-box { display:flex; align-items:center; background:var(--card-bg); border:var(--border); border-radius:var(--radius); padding:0 12px; flex:1; min-width:200px; max-width:320px; transition:border-color 0.2s; }
  .search-box:focus-within { border-color:var(--primary); }
  .search-box svg { width:16px; height:16px; color:var(--text-muted); flex-shrink:0; }
  .search-box input { border:none; outline:none; background:transparent; padding:9px 8px; font-size:14px; color:var(--text); width:100%; font-family:var(--font); }
  .search-box input::placeholder { color:var(--text-muted); }
  .filter-select { padding:8px 12px; border:var(--border); border-radius:var(--radius); background:var(--card-bg); color:var(--text); font-size:14px; cursor:pointer; font-family:var(--font); outline:none; transition:border-color 0.2s; }
  .filter-select:focus { border-color:var(--primary); }
  .filter-info { font-size:13px; color:var(--text-muted); }

  /* 成员列表 */
  .member-list { display:flex; flex-direction:column; gap:8px; }
  .member-card { background:var(--card-bg); border-radius:var(--radius-lg); border:var(--border); padding:16px 20px; display:flex; align-items:center; gap:14px; transition:all 0.2s; }
  .member-card:hover { box-shadow:0 4px 16px rgba(180,150,120,0.08); background:var(--card-bg); }
  .member-avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:#fff; flex-shrink:0; }
  .member-info { flex:1; min-width:0; }
  .member-name { font-size:15px; font-weight:600; }
  .member-email { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .member-meta { display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .role-tag { display:inline-flex; align-items:center; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:500; }
  .role-tag.admin { background:rgba(198,123,92,0.1); color:var(--primary); }
  .role-tag.engineer { background:rgba(212,165,116,0.12); color:#B8860B; }
  .role-tag.guest { background:rgba(139,115,85,0.08); color:var(--text-muted); }
  .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
  .status-dot.online { background:#5cb85c; }
  .status-dot.offline { background:#bbb; }
  .status-text { font-size:13px; color:var(--text-secondary); }
  .action-btn { padding:4px 8px; border:none; background:transparent; cursor:pointer; color:var(--text-muted); border-radius:4px; transition:all 0.2s; font-size:13px; }
  .action-btn:hover { color:var(--primary); background:rgba(198,123,92,0.08); }
  .action-btn.danger:hover { color:#c0392b; background:rgba(192,57,43,0.06); }

  /* 模态框 */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(60,45,30,0.3); z-index:999; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--card-bg); border-radius:var(--radius-lg); width:480px; max-width:90vw; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(60,45,30,0.15); }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:var(--border); }
  .modal-header h2 { font-size:18px; font-weight:600; }
  .modal-close { width:28px; height:28px; border:none; background:transparent; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); transition:all 0.2s; font-size:18px; }
  .modal-close:hover { background:var(--bg); color:var(--text); }
  .modal-body { padding:20px 24px; }
  .form-group { margin-bottom:15px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:5px; }
  .form-group input,.form-group select { width:100%; padding:9px 12px; border:var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); font-size:14px; outline:none; font-family:var(--font); transition:border-color 0.2s; }
  .form-group input:focus,.form-group select:focus { border-color:var(--primary); }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; padding:16px 24px 20px; border-top:var(--border); }

  /* 空状态 */
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state svg { width:48px; height:48px; margin-bottom:12px; opacity:0.4; }

  @media(max-width:768px){ .sidebar { width:60px; } .sidebar-logo-text,.sidebar-user-name,.sidebar-user-role,.nav-item span,.nav-section { display:none; } .sidebar-logo{justify-content:center;padding:16px 8px;} .nav-item{justify-content:center;padding:10px;}.sidebar-user{justify-content:center;padding:12px;} .content{padding:20px 16px;max-width:calc(100vw - 60px);} .filter-bar{flex-direction:column;} .search-box{max-width:100%;} .member-card{flex-wrap:wrap;} .member-meta{width:100%;margin-top:8px;justify-content:flex-end;} }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo"><div class="sidebar-logo-icon">AI</div><span class="sidebar-logo-text">AI-HUB</span></div>
  <div class="sidebar-nav">
    <div class="nav-item" onclick="location.href='../../00-首页仪表盘/首页仪表盘.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span>首页</span></div>

    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14M7 3v3M17 3v3"/><rect x="3" y="10" width="18" height="4" rx="1"/></svg><span>API接口测试</span></div>

    <div class="nav-section">核心模块</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><span>测试管理</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>配置中心</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>AI聊天室</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg><span>知识库</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>系统管理</span></div>
  </div>
  <div class="sidebar-user"><div class="sidebar-user-avatar">张</div><div><div class="sidebar-user-name">张三</div><div class="sidebar-user-role">管理员</div></div></div>
</div>

<div class="content">
  <div class="page-header">
    <div>
      <div class="page-header-breadcrumb"><a href="../../00-首页仪表盘/首页仪表盘.html">首页</a> / <a href="测试管理模块.html">测试管理</a> / 成员管理</div>
      <h1>成员管理</h1>
    </div>
    <button class="btn btn-primary" onclick="openModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      邀请成员
    </button>
  </div>

  <div class="sub-nav">
    <a class="sub-nav-item" href="测试管理模块.html">模块概览</a>
    <a class="sub-nav-item" href="项目管理.html">项目管理</a>
    <a class="sub-nav-item" href="版本管理.html">版本管理</a>
    <a class="sub-nav-item active" href="成员管理.html">成员管理</a>
    <a class="sub-nav-item" href="用例评审.html">用例评审</a>
  </div>

  <div class="filter-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索成员姓名或邮箱..." oninput="filterMembers()">
    </div>
    <select class="filter-select" id="roleFilter" onchange="filterMembers()">
      <option value="">全部角色</option>
      <option value="管理员">管理员</option>
      <option value="测试工程师">测试工程师</option>
      <option value="访客">访客</option>
    </select>
    <span class="filter-info" id="countInfo">共 8 名成员</span>
  </div>

  <div class="member-list" id="memberList"></div>
</div>

<!-- 邀请成员模态框 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><h2>邀请成员</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>姓名</label><input type="text" placeholder="请输入成员姓名" id="memName"></div>
      <div class="form-group"><label>邮箱</label><input type="email" placeholder="请输入邮箱地址" id="memEmail"></div>
      <div class="form-group"><label>角色</label>
        <select id="memRole"><option value="测试工程师">测试工程师</option><option value="管理员">管理员</option><option value="访客">访客</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="inviteMember()">发送邀请</button>
    </div>
  </div>
</div>

<script>
  const avatarColors = ['#C67B5C','#D4A574','#B8860B','#8B7355','#A0522D','#CD853F','#D2691E','#BFA98A'];
  let members = [
    { name:'张三', email:'zhangsan@aihub.com', role:'管理员', online:true },
    { name:'李四', email:'lisi@aihub.com', role:'测试工程师', online:true },
    { name:'王五', email:'wangwu@aihub.com', role:'测试工程师', online:false },
    { name:'赵六', email:'zhaoliu@aihub.com', role:'访客', online:true },
    { name:'陈七', email:'chenqi@aihub.com', role:'测试工程师', online:false },
    { name:'刘八', email:'liuba@aihub.com', role:'访客', online:true },
    { name:'孙九', email:'sunjia@aihub.com', role:'测试工程师', online:true },
    { name:'周十', email:'zhoushi@aihub.com', role:'管理员', online:false },
  ];
  function getAvatarColor(name){ let h=0; for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%avatarColors.length; return avatarColors[h]; }
  function renderMembers(data){
    const el=document.getElementById('memberList');
    if(data.length===0){
      el.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg><p>暂无匹配的成员</p></div>';
      return;
    }
    const roleCls={'管理员':'admin','测试工程师':'engineer','访客':'guest'};
    el.innerHTML=data.map(m=>\`
      <div class="member-card">
        <div class="member-avatar" style="background:\${getAvatarColor(m.name)}">\${m.name[0]}</div>
        <div class="member-info">
          <div class="member-name">\${m.name}</div>
          <div class="member-email">\${m.email}</div>
        </div>
        <div class="member-meta">
          <span class="role-tag \${roleCls[m.role]}">\${m.role}</span>
          <span class="status-text"><span class="status-dot \${m.online?'online':'offline'}"></span>\${m.online?'在线':'离线'}</span>
          <button class="action-btn" onclick="editMember('\${m.name}')" title="编辑">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="action-btn danger" onclick="removeMember('\${m.name}')" title="移除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>\`).join('');
    document.getElementById('countInfo').textContent=\`共 \${data.length} 名成员\`;
  }
  function filterMembers(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const r=document.getElementById('roleFilter').value;
    const filtered=members.filter(m=>(m.name.toLowerCase().includes(q)||m.email.toLowerCase().includes(q))&&(!r||m.role===r));
    renderMembers(filtered);
  }
  function openModal(){ document.getElementById('modal').classList.add('open'); }
  function closeModal(){ document.getElementById('modal').classList.remove('open'); }
  function inviteMember(){
    const name=document.getElementById('memName').value.trim();
    const email=document.getElementById('memEmail').value.trim();
    const role=document.getElementById('memRole').value;
    if(!name||!email){ alert('请填写姓名和邮箱'); return; }
    members.push({name,email,role,online:false});
    filterMembers();
    closeModal();
    document.querySelectorAll('#modal input').forEach(i=>i.value='');
  }
  function editMember(name){ alert('编辑成员: '+name+'\n(此为原型演示)'); }
  function removeMember(name){ if(confirm('确定要移除成员 "'+name+'" 吗？')){ members=members.filter(m=>m.name!==name); filterMembers(); } }
  filterMembers();
</script>
</body>
</html>
