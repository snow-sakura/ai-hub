<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP自动化测试 - 项目管理</title>
<style>
:root {
  --primary:#C67B5C; --primary-light:#D49472; --accent:#D4A574;
  --bg:#FBF7F0; --card-bg:#FFFDF9; --sidebar-bg:#F6F0E7;
  --text:#3D2E1F; --text-secondary:#5C4A38; --text-muted:#8B7355;
  --border:1px solid rgba(180,150,120,0.12);
  --radius:8px; --radius-lg:12px;
  --font: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
.sidebar { width:220px; background:var(--sidebar-bg); border-right:var(--border); padding:24px 0; flex-shrink:0; }
.logo { padding:0 20px 24px; border-bottom:var(--border); margin-bottom:16px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 20px; color:var(--text-secondary); text-decoration:none; font-size:14px; transition:all .2s; border-right:3px solid transparent; }
.nav-item:hover { background:rgba(198,123,92,0.06); color:var(--text); }
.nav-item.active { background:rgba(198,123,92,0.1); color:var(--primary); border-right-color:var(--primary); font-weight:600; }
.nav-item svg { flex-shrink:0; }
.nav-section { font-size:11px; color:var(--text-muted); padding:16px 20px 6px; text-transform:uppercase; letter-spacing:.5px; }
.main { flex:1; overflow-y:auto; }
.topbar { display:flex; justify-content:space-between; align-items:center; padding:16px 32px; border-bottom:var(--border); background:var(--card-bg); }
.page-title { font-size:20px; font-weight:600; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.notif-btn { position:relative; background:none; border:none; cursor:pointer; color:var(--text-secondary); padding:4px; }
.notif-dot { position:absolute; top:0; right:0; width:8px; height:8px; background:#E8735A; border-radius:50%; border:2px solid var(--card-bg); }
.avatar { width:32px; height:32px; border-radius:50%; background:var(--primary-light); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
.content { padding:24px 32px; }
.section-title { font-size:15px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* Toolbar */
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.search-box { display:flex; align-items:center; background:var(--card-bg); border:var(--border); border-radius:var(--radius); padding:8px 12px; width:280px; }
.search-box input { border:none; outline:none; background:transparent; margin-left:8px; flex:1; font-size:13px; color:var(--text); }
.search-box input::placeholder { color:var(--text-muted); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius); font-size:13px; cursor:pointer; border:none; font-weight:500; transition:all .2s; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-light); }
.btn-sm { padding:5px 12px; font-size:12px; }

/* Project Grid */
.project-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.project-card { background:var(--card-bg); border:var(--border); border-radius:var(--radius-lg); padding:20px; transition:all .2s; }
.project-card:hover { box-shadow:0 2px 12px rgba(198,123,92,0.08); transform:translateY(-1px); }
.project-card .pheader { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.project-card .picon { width:40px; height:40px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; }
.project-card .pname { font-size:15px; font-weight:600; }
.project-card .ppackage { font-size:12px; color:var(--text-muted); margin-top:2px; font-family:monospace; }
.project-card .pmeta { display:flex; gap:16px; padding-top:12px; border-top:var(--border); margin-top:12px; font-size:12px; color:var(--text-muted); }
.project-card .pmeta span { display:flex; align-items:center; gap:4px; }
.platform-tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:4px; }
.ios-tag { background:#E3F2FD; color:#1565C0; }
.android-tag { background:#E8F5E9; color:#2E7D32; }

/* Modal */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card-bg); border-radius:var(--radius-lg); width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.12); }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:var(--border); }
.modal-header h3 { font-size:15px; }
.modal-close { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; }
.modal-body { padding:20px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:4px; font-weight:500; }
.form-group input, .form-group select { width:100%; padding:8px 12px; border:var(--border); border-radius:var(--radius); font-size:13px; background:var(--card-bg); color:var(--text); outline:none; }
.form-group select { cursor:pointer; }
.form-group input:focus, .form-group select:focus { border-color:var(--primary); }
.form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
.btn-outline { background:transparent; border:var(--border); color:var(--text-secondary); }
.btn-outline:hover { background:var(--bg); }
</style>
</head>
