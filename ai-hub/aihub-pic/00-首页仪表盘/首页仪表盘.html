<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI-HUB 智能工作台</title>
<style>
  :root {
    --primary:#C67B5C; --primary-light:#D49472; --accent:#D4A574;
    --bg:#FBF7F0; --card-bg:#FFFDF9; --sidebar-bg:#F6F0E7;
    --text:#3D2E1F; --text-secondary:#5C4A38; --text-muted:#8B7355;
    --border:1px solid rgba(180,150,120,0.12);
    --radius:8px; --radius-lg:12px;
    --font: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
  /* 顶部栏 */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:64px; background:var(--card-bg); border-bottom:var(--border); position:sticky; top:0; z-index:100; }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .topbar-logo { width:36px; height:36px; background:linear-gradient(135deg,var(--primary),var(--accent)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; }
  .topbar-title { font-size:20px; font-weight:700; color:var(--text); letter-spacing:0.5px; }
  .topbar-right { display:flex; align-items:center; gap:20px; }
  .lang-switch { display:flex; background:var(--bg); border-radius:6px; padding:2px; border:var(--border); }
  .lang-btn { padding:4px 12px; border:none; background:transparent; cursor:pointer; font-size:13px; border-radius:4px; color:var(--text-muted); transition:all 0.2s; font-family:var(--font); }
  .lang-btn.active { background:var(--primary); color:#fff; }
  .lang-btn:hover:not(.active) { color:var(--text); }
  .user-info { display:flex; align-items:center; gap:10px; cursor:pointer; position:relative; padding:4px 12px; border-radius:var(--radius); transition:background 0.2s; }
  .user-info:hover { background:var(--bg); }
  .user-avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary-light),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:600; }
  .user-name { font-size:14px; font-weight:500; }
  .user-dropdown { display:none; position:absolute; top:100%; right:0; background:var(--card-bg); border:var(--border); border-radius:var(--radius); box-shadow:0 8px 24px rgba(60,45,30,0.1); min-width:140px; padding:4px; margin-top:4px; }
  .user-info.open .user-dropdown { display:block; }
  .user-dropdown-item { padding:8px 16px; cursor:pointer; font-size:14px; border-radius:4px; color:var(--text-secondary); transition:background 0.2s; }
  .user-dropdown-item:hover { background:var(--bg); }
  .user-dropdown-divider { height:1px; background:var(--border); margin:4px 8px; }
  /* 主内容 */
  .main { max-width:1200px; margin:0 auto; padding:32px 24px; }
  /* 欢迎区 */
  .welcome { margin-bottom:32px; }
  .welcome h1 { font-size:28px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .welcome h1 span { background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .welcome p { color:var(--text-muted); font-size:15px; }
  /* 统计卡片 */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
  .stat-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:20px; border:var(--border); display:flex; align-items:center; gap:16px; transition:all 0.25s; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(180,150,120,0.1); }
  .stat-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stat-icon svg { width:24px; height:24px; }
  .stat-body { flex:1; }
  .stat-number { font-size:24px; font-weight:700; color:var(--text); line-height:1.2; }
  .stat-label { font-size:13px; color:var(--text-muted); margin-top:2px; }
  .stat-trend { font-size:12px; padding:2px 8px; border-radius:10px; margin-top:4px; display:inline-block; }
  .stat-trend.up { background:rgba(198,123,92,0.1); color:var(--primary); }
  .stat-trend.down { background:rgba(180,150,120,0.1); color:var(--text-muted); }
  /* 功能模块网格 */
  .section-title { font-size:18px; font-weight:600; color:var(--text); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .module-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .module-card { background:var(--card-bg); border-radius:var(--radius-lg); padding:24px; border:var(--border); cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; }
  .module-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,var(--primary),var(--accent)); opacity:0; transition:opacity 0.3s; }
  .module-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(180,150,120,0.12); }
  .module-card:hover::before { opacity:1; }
  .module-card-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .module-card-icon svg { width:22px; height:22px; }
  .module-card h3 { font-size:16px; font-weight:600; margin-bottom:6px; }
  .module-card p { font-size:13px; color:var(--text-muted); line-height:1.5; margin-bottom:12px; }
  .module-card-meta { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--text-muted); }
  .module-card-meta span { display:flex; align-items:center; gap:4px; }
  /* 底部 */
  .footer { text-align:center; padding:24px; color:var(--text-muted); font-size:13px; border-top:var(--border); margin-top:32px; }
  /* 响应式 */
  @media(max-width:900px){ .stats { grid-template-columns:repeat(2,1fr); } .module-grid { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:600px){ .topbar { padding:0 16px; } .main { padding:20px 16px; } .stats { grid-template-columns:1fr; } .module-grid { grid-template-columns:1fr; } .welcome h1 { font-size:22px; } }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">AI</div>
    <div class="topbar-title">AI-HUB</div>
  </div>
  <div class="topbar-right">
    <div class="lang-switch">
      <button class="lang-btn active" onclick="switchLang(this)">中文</button>
      <button class="lang-btn" onclick="switchLang(this)">English</button>
    </div>
    <div class="user-info" onclick="this.classList.toggle('open')">
      <div class="user-avatar">张</div>
      <span class="user-name">张三</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><path d="M6 9l6 6 6-6"/></svg>
      <div class="user-dropdown">
        <div class="user-dropdown-item">个人信息</div>
        <div class="user-dropdown-item">设置</div>
        <div class="user-dropdown-divider"></div>
        <div class="user-dropdown-item" onclick="event.stopPropagation();toggleLogin()">切换登录状态</div>
        <div class="user-dropdown-item" style="color:#C67B5C">退出登录</div>
      </div>
    </div>
  </div>
</div>

<!-- 主内容 -->
<div class="main">
  <!-- 欢迎区 -->
  <div class="welcome">
    <h1><span>AI-HUB</span> 智能工作台</h1>
    <p>欢迎回来，张三！今日有 12 条待办事项等待处理。</p>
  </div>

  <!-- 统计卡片 -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(198,123,92,0.12);color:var(--primary)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">24</div>
        <div class="stat-label">项目总数</div>
        <div class="stat-trend up">较上月 +3</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(212,165,116,0.12);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">1,286</div>
        <div class="stat-label">用例总数</div>
        <div class="stat-trend up">较上月 +156</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(212,165,116,0.12);color:var(--accent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">386</div>
        <div class="stat-label">今日执行</div>
        <div class="stat-trend up">较昨日 +42</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:rgba(198,123,92,0.12);color:var(--primary)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-number">94.6%</div>
        <div class="stat-label">通过率</div>
        <div class="stat-trend up">较上周 +1.2%</div>
      </div>
    </div>
  </div>

  <!-- 功能模块 -->
  <div class="section-title">功能模块</div>
  <div class="module-grid" id="moduleGrid"></div>
</div>

<div class="footer">AI-HUB 智能测试平台 &copy; 2025</div>

<script>
  const modules = [
    { name:'AI智能测试', desc:'基于AI大模型的智能测试用例生成与执行', subs:'6个子模块', color:'#C67B5C', icon:'brain' },
    { name:'API接口测试', desc:'RESTful & GraphQL 接口自动化测试', subs:'4个子模块', color:'#D4A574', icon:'plug' },
    { name:'UI自动化', desc:'Web UI 自动化测试与视觉回归检测', subs:'5个子模块', color:'#C67B5C', icon:'monitor' },
    { name:'APP自动化', desc:'移动端APP自动化测试与兼容性测试', subs:'4个子模块', color:'#D4A574', icon:'smartphone' },
    { name:'测试管理', desc:'项目管理、版本管理、成员与用例评审', subs:'5个子模块', color:'#C67B5C', icon:'folder' },
    { name:'配置中心', desc:'全局配置、环境变量与第三方集成', subs:'3个子模块', color:'#D4A574', icon:'settings' },
    { name:'AI聊天室', desc:'' },
    { name:'知识库', desc:'测试知识沉淀与经验分享', subs:'4个子模块', color:'#C67B5C', icon:'book' },
    { name:'系统管理', desc:'用户管理、权限控制与审计日志', subs:'5个子模块', color:'#D4A574', icon:'shield' },
  ];
  const svgIcons = {
    brain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V12a2 2 0 01-2 2h-1v2"/><circle cx="12" cy="22" r="2"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/><path d="M12 6v2m-3 0a3 3 0 00-3 3v6"/></svg>`,
    plug:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M12 5v14M7 3v3M17 3v3"/><rect x="3" y="10" width="18" height="4" rx="1"/></svg>`,
    monitor:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
    smartphone:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>`,
    folder:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>`,
    settings:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
    chat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`,
    book:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>`,
    shield:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  };
  function renderModules(){
    const grid=document.getElementById('moduleGrid');
    modules.forEach(m=>{
      const card=document.createElement('div'); card.className='module-card';
      card.innerHTML=\`
        <div class="module-card-icon" style="background:\${m.color}18;color:\${m.color}">\${svgIcons[m.icon]}</div>
        <h3>\${m.name}</h3>
        <p>\${m.desc||'与AI对话，获取智能测试建议与实时帮助'}</p>
        <div class="module-card-meta">
          <span>\${m.subs||'实时对话'}</span>
        </div>
      \`;
      card.addEventListener('click',()=>{
        if(m.name==='测试管理'){ window.open('../05-测试管理/测试管理模块.html','_blank'); }
      });
      grid.appendChild(card);
    });
  }
  renderModules();

  function switchLang(btn){
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  function toggleLogin(){
    const avatar=document.querySelector('.user-avatar');
    const name=document.querySelector('.user-name');
    if(name.textContent==='张三'){
      name.textContent='未登录';
      avatar.textContent='?';
      avatar.style.background='rgba(180,150,120,0.2)';
      avatar.style.color='var(--text-muted)';
    }else{
      name.textContent='张三';
      avatar.textContent='张';
      avatar.style.background='';
      avatar.style.color='';
    }
    document.querySelector('.user-info').classList.remove('open');
  }
  // 点击外部关闭下拉
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.user-info')) document.querySelector('.user-info')?.classList.remove('open'); });
</script>
</body>
</html>
