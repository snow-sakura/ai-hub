<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄哄模拟器 - 记忆管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FBF7F0;
  color: #3D2E1F;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
/* Nav */
.navbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: #FFFDF9;
  border-bottom: 1px solid rgba(180,150,120,0.12);
  position: sticky; top: 0; z-index: 100;
}
.nav-back {
  display: flex; align-items: center; gap: 4px;
  color: #8B7355; font-size: 14px; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; transition: all 0.2s;
}
.nav-back:hover { background: rgba(198,123,92,0.08); color: #C67B5C; }
.nav-title { flex: 1; font-size: 18px; font-weight: 600; }
.nav-count {
  font-size: 13px; color: #B5A590; font-weight: 400; margin-left: 4px;
}
.nav-actions { display: flex; gap: 8px; }
.nav-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(180,150,120,0.15);
  background: #FFFDF9; color: #8B7355; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:hover { background: rgba(198,123,92,0.08); color: #C67B5C; border-color: #C67B5C; }
.nav-btn-primary {
  background: #C67B5C; color: white; border-color: #C67B5C;
}
.nav-btn-primary:hover { background: #B56A4A; }

/* Content */
.content {
  flex: 1; overflow-y: auto; padding: 16px 20px 24px;
  max-width: 600px; margin: 0 auto; width: 100%;
}

/* Category filter */
.category-filters {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.cat-filter {
  padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(180,150,120,0.15);
  background: #FFFDF9; color: #8B7355; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.cat-filter:hover { border-color: #C67B5C; color: #C67B5C; }
.cat-filter.active {
  background: #C67B5C; color: white; border-color: #C67B5C;
}

/* Memory list */
.memory-list { display: flex; flex-direction: column; gap: 10px; }

/* Memory card */
.memory-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  background: #FFFDF9; border: 1px solid rgba(180,150,120,0.12);
  box-shadow: 0 2px 8px rgba(60,40,20,0.04);
  transition: all 0.2s;
}
.memory-card:hover { box-shadow: 0 4px 14px rgba(60,40,20,0.06); }
.memory-border {
  width: 3px; height: 42px; border-radius: 2px; flex-shrink: 0; margin-top: 2px;
}
.memory-content { flex: 1; min-width: 0; }
.memory-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.memory-tag {
  padding: 2px 10px; border-radius: 10px; font-size: 11px;
  font-weight: 500; color: white;
}
.memory-time {
  font-size: 11px; color: #B5A590;
}
.memory-text {
  font-size: 14px; line-height: 1.5; color: #3D2E1F;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.memory-actions {
  display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;
  flex-shrink: 0;
}
.memory-card:hover .memory-actions { opacity: 1; }
.mem-action-btn {
  width: 30px; height: 30px; border: none; border-radius: 6px;
  background: transparent; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; color: #8B7355;
}
.mem-action-btn:hover { background: rgba(198,123,92,0.1); color: #C67B5C; }
.mem-action-btn.danger:hover { background: rgba(212,116,92,0.1); color: #D4745C; }

/* Edit state */
.memory-card.editing .memory-text {
  white-space: normal;
}
.memory-edit-input {
  width: 100%; padding: 8px 12px; border-radius: 8px;
  border: 1px solid #C67B5C; outline: none;
  font-size: 14px; font-family: inherit; line-height: 1.5;
  background: #FFFDF9; color: #3D2E1F;
  transition: border-color 0.2s;
}
.memory-edit-input:focus { box-shadow: 0 0 0 2px rgba(198,123,92,0.15); }
.memory-edit-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.edit-btn {
  padding: 4px 14px; border-radius: 6px; border: none;
  font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.2s;
}
.edit-btn-save { background: #C67B5C; color: white; }
.edit-btn-save:hover { background: #B56A4A; }
.edit-btn-cancel { background: rgba(180,150,120,0.1); color: #8B7355; }
.edit-btn-cancel:hover { background: rgba(180,150,120,0.2); }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  padding: 80px 20px; color: #8B7355;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
.empty-text { font-size: 15px; line-height: 1.6; max-width: 300px; }
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-back">← 返回哄哄模拟器</div>
  <div class="nav-title">💭 记忆管理<span class="nav-count">· 共 5 条</span></div>
  <div class="nav-actions">
    <button class="nav-btn nav-btn-primary">清除所有</button>
  </div>
</div>

<div class="content">
  <!-- Category filters -->
  <div class="category-filters">
    <span class="cat-filter active">全部</span>
    <span class="cat-filter">事实</span>
    <span class="cat-filter">偏好</span>
    <span class="cat-filter">事件</span>
  </div>

  <!-- Memory list -->
  <div class="memory-list">
    <!-- Item 1: fact -->
    <div class="memory-card">
      <div class="memory-border" style="background:#7BA87D;"></div>
      <div class="memory-content">
        <div class="memory-header">
          <span class="memory-tag" style="background:#7BA87D;">事实</span>
          <span class="memory-time">记录于 04-03 14:23</span>
        </div>
        <div class="memory-text">她有一只叫"团子"的英短蓝猫，养了三年了</div>
      </div>
      <div class="memory-actions">
        <button class="mem-action-btn">✏️</button>
        <button class="mem-action-btn danger">🗑️</button>
      </div>
    </div>

    <!-- Item 2: preference -->
    <div class="memory-card">
      <div class="memory-border" style="background:#C67B5C;"></div>
      <div class="memory-content">
        <div class="memory-header">
          <span class="memory-tag" style="background:#C67B5C;">偏好</span>
          <span class="memory-time">记录于 04-03 14:25</span>
        </div>
        <div class="memory-text">她很喜欢吃抹茶味的甜品，每次吃都会开心</div>
      </div>
      <div class="memory-actions">
        <button class="mem-action-btn">✏️</button>
        <button class="mem-action-btn danger">🗑️</button>
      </div>
    </div>

    <!-- Item 3: event - editing state -->
    <div class="memory-card editing">
      <div class="memory-border" style="background:#9B8EC4;"></div>
      <div class="memory-content">
        <div class="memory-header">
          <span class="memory-tag" style="background:#9B8EC4;">事件</span>
          <span class="memory-time">记录于 04-05 16:10</span>
        </div>
        <div class="memory-text">
          <input class="memory-edit-input" value="上周五和男朋友分手，原因是对方觉得她太敏感了" />
        </div>
        <div class="memory-edit-actions">
          <button class="edit-btn edit-btn-save">💾 保存</button>
          <button class="edit-btn edit-btn-cancel">✕ 取消</button>
        </div>
      </div>
      <div class="memory-actions">
        <button class="mem-action-btn">💾</button>
        <button class="mem-action-btn danger">✕</button>
      </div>
    </div>

    <!-- Item 4: fact -->
    <div class="memory-card">
      <div class="memory-border" style="background:#7BA87D;"></div>
      <div class="memory-content">
        <div class="memory-header">
          <span class="memory-tag" style="background:#7BA87D;">事实</span>
          <span class="memory-time">记录于 04-05 16:12</span>
        </div>
        <div class="memory-text">她在互联网公司做产品运营，工作压力很大，经常加班到九点</div>
      </div>
      <div class="memory-actions">
        <button class="mem-action-btn">✏️</button>
        <button class="mem-action-btn danger">🗑️</button>
      </div>
    </div>

    <!-- Item 5: preference -->
    <div class="memory-card">
      <div class="memory-border" style="background:#C67B5C;"></div>
      <div class="memory-content">
        <div class="memory-header">
          <span class="memory-tag" style="background:#C67B5C;">偏好</span>
          <span class="memory-time">记录于 04-06 20:05</span>
        </div>
        <div class="memory-text">她喜欢听周杰伦的老歌，尤其"晴天"和"七里香"</div>
      </div>
      <div class="memory-actions">
        <button class="mem-action-btn">✏️</button>
        <button class="mem-action-btn danger">🗑️</button>
      </div>
    </div>
  </div>

  <!-- Empty state (hidden) -->
  <!--
  <div class="empty-state">
    <div class="empty-icon">🧠</div>
    <div class="empty-text">暂无记忆，AI 会在对话中自动记住重要信息</div>
  </div>
  -->
</div>

</body>
</html>
