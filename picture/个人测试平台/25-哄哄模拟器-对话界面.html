<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄哄模拟器 - 对话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FBF7F0;
  color: #3D2E1F;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
/* Nav */
.navbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: #FFFDF9;
  border-bottom: 1px solid rgba(180,150,120,0.12);
  position: sticky; top: 0; z-index: 100;
}
.nav-back {
  display: flex; align-items: center; gap: 4px;
  color: #8B7355; font-size: 14px; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; transition: all 0.2s;
}
.nav-back:hover { background: rgba(198,123,92,0.08); color: #C67B5C; }
.nav-scene-pill {
  flex: 1; display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 14px; border-radius: 20px;
  background: rgba(198,123,92,0.1); color: #C67B5C;
  font-size: 13px; font-weight: 500;
  width: fit-content;
}
.nav-actions { display: flex; gap: 8px; align-items: center; }
.nav-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(180,150,120,0.15);
  background: #FFFDF9; color: #8B7355; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:hover { background: rgba(198,123,92,0.08); color: #C67B5C; border-color: #C67B5C; }
.nav-btn-primary {
  background: #C67B5C; color: white; border-color: #C67B5C;
}
.nav-btn-primary:hover { background: #B56A4A; color: white; }

/* Emotion Panel */
.emotion-panel {
  margin: 12px 20px; padding: 16px;
  border-radius: 12px; background: #FFFDF9;
  border: 1px solid rgba(180,150,120,0.12);
  box-shadow: 0 4px 14px rgba(60,40,20,0.06);
}
.ep-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.ep-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #C67B5C, #D4A574);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: white;
}
.ep-info { flex: 1; }
.ep-name { font-size: 14px; font-weight: 600; }
.ep-identity { font-size: 11px; color: #8B7355; }
.ep-emotion {
  padding: 4px 12px; border-radius: 20px;
  background: rgba(212,116,92,0.1); color: #D4745C;
  font-size: 12px; font-weight: 500;
}
.ep-forgiveness { margin-bottom: 10px; }
.ef-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px;
}
.ef-label { font-size: 12px; color: #8B7355; }
.ef-value { font-size: 14px; font-weight: 700; }
.ef-delta {
  font-size: 12px; font-weight: 500; color: #7BA87D; margin-left: 6px;
}
.ef-progress {
  height: 6px; border-radius: 3px; background: rgba(180,150,120,0.15);
  overflow: hidden;
}
.ef-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #D4745C, #D4A574, #7BA87D);
  width: 32%; transition: width 0.8s ease;
}
.ep-reason {
  font-size: 12px; color: #B5A590; margin-top: 6px; line-height: 1.4;
}

/* Message List */
.message-list {
  flex: 1; overflow-y: auto; padding: 8px 20px 12px;
}
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  padding: 60px 20px; color: #8B7355;
}
.empty-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #C67B5C, #D4A574);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: white; margin-bottom: 12px;
}
.empty-name { font-size: 18px; font-weight: 600; color: #3D2E1F; margin-bottom: 2px; }
.empty-identity { font-size: 13px; color: #B5A590; margin-bottom: 10px; }
.empty-story {
  font-size: 13px; line-height: 1.6; color: #8B7355;
  max-width: 320px; margin-bottom: 16px;
}
.empty-hint {
  font-size: 13px; color: #B5A590; padding: 8px 16px;
  border-radius: 20px; background: rgba(180,150,120,0.08);
}

/* Message Bubbles */
.msg { margin-bottom: 14px; display: flex; gap: 8px; }
.msg-user { justify-content: flex-end; }
.msg-ai { justify-content: flex-start; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #C67B5C, #D4A574);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: white; flex-shrink: 0;
}
.msg-body { max-width: 75%; }
.msg-sender {
  font-size: 11px; color: #B5A590; margin-bottom: 2px; padding: 0 4px;
}
.msg-bubble {
  padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5;
  word-break: break-word;
}
.msg-user .msg-bubble {
  background: #EBE5DA; color: #3D2E1F;
  border-bottom-right-radius: 4px;
}
.msg-ai .msg-bubble {
  background: #FFFDF9; color: #3D2E1F;
  border: 1px solid rgba(180,150,120,0.12);
  border-bottom-left-radius: 4px;
}
.msg-ai .msg-bubble strong { color: #C67B5C; }
.msg-ai .msg-bubble blockquote {
  border-left: 2px solid #D4A574; padding-left: 8px;
  color: #8B7355; font-size: 13px; margin: 4px 0;
}
.msg-time {
  font-size: 11px; color: #B5A590; padding: 2px 4px 0;
}

/* Typing Indicator */
.typing-indicator {
  display: flex; align-items: center; gap: 4px;
  padding: 12px 14px;
}
.typing-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #B5A590; animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* Composer */
.composer {
  padding: 12px 20px; background: #FFFDF9;
  border-top: 1px solid rgba(180,150,120,0.12);
}
.composer-inner {
  display: flex; align-items: flex-end; gap: 8px;
  background: #FFFDF9; border-radius: 20px;
  border: 1px solid rgba(180,150,120,0.15);
  padding: 8px 8px 8px 16px;
  box-shadow: 0 2px 8px rgba(60,40,20,0.06);
}
.composer-textarea {
  flex: 1; border: none; outline: none; resize: none;
  font-size: 14px; font-family: inherit; line-height: 1.5;
  background: transparent; color: #3D2E1F;
  min-height: 24px; max-height: 80px;
}
.composer-textarea::placeholder { color: #B5A590; }
.send-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: #C67B5C; color: white;
  font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.send-btn:hover { background: #B56A4A; transform: scale(1.05); }
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-back">← 返回</div>
  <div class="nav-scene-pill">💔 失恋安慰</div>
  <div class="nav-actions">
    <button class="nav-btn">📊</button>
    <button class="nav-btn nav-btn-primary">重新开始</button>
  </div>
</div>

<!-- Emotion Panel -->
<div class="emotion-panel">
  <div class="ep-header">
    <div class="ep-avatar">👩</div>
    <div class="ep-info">
      <div class="ep-name">林小雨</div>
      <div class="ep-identity">你的高中同学</div>
    </div>
    <div class="ep-emotion">😢 悲伤</div>
  </div>
  <div class="ep-forgiveness">
    <div class="ef-header">
      <span class="ef-label">原谅值</span>
      <span>
        <span class="ef-value">32%</span>
        <span class="ef-delta">↑ +5.2</span>
      </span>
    </div>
    <div class="ef-progress">
      <div class="ef-fill" style="width:32%"></div>
    </div>
  </div>
  <div class="ep-reason">你刚刚表达了对她的理解，她似乎愿意多说一些了</div>
</div>

<!-- Message List -->
<div class="message-list">
  <!-- Empty state (hidden with messages) -->
  <!-- User msg 1 -->
  <div class="msg msg-user">
    <div class="msg-body">
      <div class="msg-bubble">怎么了，感觉你最近不太开心</div>
      <div class="msg-time">14:23</div>
    </div>
  </div>

  <!-- AI msg 2 -->
  <div class="msg msg-ai">
    <div class="msg-avatar">👩</div>
    <div class="msg-body">
      <div class="msg-sender">林小雨</div>
      <div class="msg-bubble">
        唉…你也看出来了吗 😔<br><br>
        其实也没什么大事，就是…<br>
        <strong>他说我们不合适，然后就这样了</strong><br><br>
        三年了，说放就放。我是不是真的很差劲？
      </div>
      <div class="msg-time">14:23</div>
    </div>
  </div>

  <!-- User msg 3 -->
  <div class="msg msg-user">
    <div class="msg-body">
      <div class="msg-bubble">有什么我可以帮你的吗？</div>
      <div class="msg-time">14:24</div>
    </div>
  </div>

  <!-- AI typing -->
  <div class="msg msg-ai">
    <div class="msg-avatar">👩</div>
    <div class="msg-body">
      <div class="msg-sender">林小雨</div>
      <div class="msg-bubble typing-indicator">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>
  </div>
</div>

<!-- Composer -->
<div class="composer">
  <div class="composer-inner">
    <textarea class="composer-textarea" placeholder="说点什么来安慰 TA…" rows="1"></textarea>
    <button class="send-btn">➤</button>
  </div>
</div>

</body>
</html>
