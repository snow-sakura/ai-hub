<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI评测师 - AI测试平台</title>
<style>
:root {
  --primary: #C67B5C; --primary-light: #D49472; --primary-bg: rgba(198,123,92,0.08);
  --accent: #D4A574; --bg: #FBF7F0; --card-bg: #FFFDF9; --sidebar-bg: #F6F0E7;
  --text: #3D2E1F; --text-secondary: #5C4A38; --text-muted: #8B7355;
  --border: 1px solid rgba(180,150,120,0.12); --shadow: 0 4px 14px rgba(60,40,20,0.06);
  --success: #7BA87D; --danger: #D4745C; --radius: 8px;
  --bubble-ai: #F0EBE3; --bubble-user: #EDE4D6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,PingFang SC,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow:hidden}

/* === Navigation Sidebar === */
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100}
.sidebar-logo{padding:16px 20px;font-size:18px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo::before{content:"🧪";font-size:22px}
.sidebar-menu{padding:12px 0}
.menu-group-title{padding:8px 20px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.menu-item{display:flex;align-items:center;padding:10px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:10px}
.menu-item:hover{background:rgba(198,123,92,0.06)}
.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:20px;text-align:center;font-size:16px}

.main{margin-left:240px;flex:1;display:flex;flex-direction:column;height:100vh}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;flex-shrink:0}
.breadcrumb{font-size:13px;color:var(--text-muted)}
.breadcrumb span{color:var(--text-secondary)}

/* === Main Layout === */
.tester-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 48px)}

/* === Left Sidebar (Session History) === */
.session-sidebar{width:280px;min-width:240px;max-width:320px;background:var(--card-bg);border-right:var(--border);display:flex;flex-direction:column;flex-shrink:0}
.session-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:var(--border)}
.session-header h3{font-size:15px;font-weight:600;color:var(--text)}
.session-clear{font-size:12px;color:var(--primary);cursor:pointer;background:none;border:none;padding:2px 6px;border-radius:4px}
.session-clear:hover{background:var(--primary-bg)}
.session-body{flex:1;overflow-y:auto;padding:12px}
.new-chat-btn{display:block;width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:12px;transition:background .2s}
.new-chat-btn:hover{background:var(--primary-light)}
.session-list{display:flex;flex-direction:column;gap:2px}
.session-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .2s;position:relative}
.session-item:hover{background:var(--primary-bg)}
.session-item.active{background:var(--primary-bg);border-left:3px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0}
.session-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.session-name{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-time{font-size:11px;color:var(--text-muted)}
.session-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s}
.session-item:hover .session-actions{opacity:1}
.session-action-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px;color:var(--text-muted);transition:all .2s}
.session-action-btn:hover{background:rgba(198,123,92,0.12);color:var(--primary)}
.session-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:32px 0}

/* === Right Chat Area === */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:var(--border);background:var(--card-bg);flex-shrink:0}
.chat-title{font-size:16px;font-weight:600;color:var(--text)}
.model-select{padding:6px 10px;border:var(--border);border-radius:6px;font-size:13px;background:var(--card-bg);color:var(--text);outline:none;cursor:pointer;min-width:160px}
.model-select:focus{border-color:var(--primary)}

/* === Message List === */
.message-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.message-row{display:flex;gap:10px;max-width:75%;position:relative}
.message-row-user{align-self:flex-end;flex-direction:row-reverse}
.message-row-ai{align-self:flex-start}
.avatar-col{flex-shrink:0}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.ai-avatar{background:var(--primary);color:#fff}
.user-avatar{background:var(--accent);color:#fff}
.message-bubble{padding:12px 16px;border-radius:12px;position:relative}
.bubble-ai{background:var(--bubble-ai);border-bottom-left-radius:4px}
.bubble-user{background:var(--bubble-user);border-bottom-right-radius:4px}
.message-text{font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
.message-time{font-size:11px;color:var(--text-muted);margin-top:6px;text-align:right}
.message-actions{position:absolute;top:-22px;display:flex;gap:2px;opacity:0;transition:opacity .2s;background:var(--card-bg);border-radius:6px;padding:2px 4px;box-shadow:0 2px 8px rgba(60,40,20,0.1)}
.message-row:hover .message-actions{opacity:1}
.message-row-user .message-actions{right:0}
.message-row-ai .message-actions{left:0}
.msg-action-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px;color:var(--text-muted);transition:all .2s}
.msg-action-btn:hover{background:var(--primary-bg);color:var(--primary)}
.message-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted)}
.message-empty .empty-icon{font-size:48px;margin-bottom:12px}
.message-empty p{font-size:14px}

/* === Input Area === */
.input-area{border-top:var(--border);padding:12px 20px;background:var(--card-bg);flex-shrink:0}
.input-row{display:flex;gap:12px;align-items:flex-end}
.input-wrap{flex:1;position:relative}
.input-wrap textarea{width:100%;padding:10px 14px;border:var(--border);border-radius:10px;font-size:14px;font-family:inherit;resize:none;outline:none;background:var(--bg);color:var(--text);line-height:1.5;min-height:48px;max-height:144px;transition:border-color .2s}
.input-wrap textarea:focus{border-color:var(--primary)}
.input-wrap textarea::placeholder{color:var(--text-muted)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.send-btn:hover:not(:disabled){background:var(--primary-light)}
.send-btn:disabled{background:rgba(198,123,92,0.3);cursor:not-allowed}

/* === Modal === */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card-bg);border-radius:12px;box-shadow:0 8px 32px rgba(60,40,20,0.15);width:380px;padding:24px;max-width:90vw}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text)}
.modal-input{width:100%;padding:10px 14px;border:var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit;color:var(--text);background:var(--bg);transition:border-color .2s}
.modal-input:focus{border-color:var(--primary)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal-btn{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
.modal-btn-cancel{background:var(--sidebar-bg);color:var(--text-secondary)}
.modal-btn-cancel:hover{background:rgba(198,123,92,0.1)}
.modal-btn-confirm{background:var(--primary);color:#fff}
.modal-btn-confirm:hover{background:var(--primary-light)}

/* === Confirm Dialog === */
.confirm-dialog .modal-box{width:340px;text-align:center}
.confirm-dialog .modal-icon{font-size:36px;margin-bottom:12px}
.confirm-dialog .modal-desc{font-size:14px;color:var(--text-secondary);margin-bottom:8px}

/* Scrollbar */
.message-container::-webkit-scrollbar,.session-body::-webkit-scrollbar{width:5px}
.message-container::-webkit-scrollbar-thumb,.session-body::-webkit-scrollbar-thumb{background:rgba(180,150,120,0.2);border-radius:10px}
.message-container::-webkit-scrollbar-track,.session-body::-webkit-scrollbar-track{background:transparent}

/* Typing indicator */
.typing-indicator{display:flex;gap:4px;padding:12px 16px;align-items:center}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:bounce 1.4s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* Toast */
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:8px;padding:10px 18px;font-size:13px;color:var(--text);box-shadow:0 4px 16px rgba(60,40,20,0.1);display:none;align-items:center;gap:8px;animation:slideIn .3s ease}
.toast.show{display:flex}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">AI测试平台</div>
  <div class="sidebar-menu">
    <div class="menu-group">
      <div class="menu-group-title">概览</div>
      <a class="menu-item" href="01-首页-数据看板.html"><span class="icon">📊</span>数据看板</a>

      <a class="menu-item" href="07-测试套件-管理.html"><span class="icon">📦</span>测试套件</a>

      <a class="menu-item" href="#"><span class="icon">📱</span>APP自动化</a>
    </div>

    </div>

</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb">AI能力 / <span>AI评测师</span></div>
  </div>

  <div class="tester-layout">
    <!-- Left: Session History -->
    <div class="session-sidebar">
      <div class="session-header">
        <h3>会话历史</h3>
        <button class="session-clear" onclick="confirmClear()">清空</button>
      </div>
      <div class="session-body">
        <button class="new-chat-btn" onclick="handleNewChat()">+ 新建对话</button>
        <div class="session-list" id="sessionList"></div>
      </div>
    </div>

    <!-- Right: Chat Area -->
    <div class="chat-area">
      <div class="chat-header">
        <span class="chat-title" id="chatTitle">AI 评测师</span>
        <select class="model-select" id="modelSelect">
          <option value="deepseek-chat">DeepSeek Chat</option>
          <option value="deepseek-reasoner">DeepSeek Reasoner</option>
          <option value="qwen-max">Qwen Max</option>
          <option value="qwen-plus">Qwen Plus</option>
          <option value="siliconflow">SiliconFlow</option>
          <option value="gpt-4o">GPT-4o</option>
        </select>
      </div>

      <div class="message-container" id="messageContainer">
        <div class="message-empty" id="messageEmpty">
          <div class="empty-icon">💬</div>
          <p>开始一个新的对话吧</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-row">
          <div class="input-wrap">
            <textarea id="inputText" rows="2" placeholder="输入您的问题..." oninput="onInputChange(this)" onkeydown="onInputKeydown(event)"></textarea>
          </div>
          <button class="send-btn" id="sendBtn" disabled onclick="handleSend()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal-box">
    <div class="modal-title">重命名会话</div>
    <input class="modal-input" id="renameInput" placeholder="输入新名称" onkeydown="if(event.key==='Enter')confirmRename()">
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeRenameModal()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="confirmRename()">确认</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Dialog -->
<div class="modal-overlay confirm-dialog" id="confirmDialog">
  <div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title" style="text-align:center">确认删除</div>
    <div class="modal-desc">确定要删除该会话吗？此操作不可撤销。</div>
    <div class="modal-actions" style="justify-content:center">
      <button class="modal-btn modal-btn-cancel" onclick="closeConfirmDialog()">取消</button>
      <button class="modal-btn modal-btn-confirm" id="confirmDeleteBtn" onclick="confirmDeleteSession()">删除</button>
    </div>
  </div>
</div>

<!-- Clear History Confirm Dialog -->
<div class="modal-overlay confirm-dialog" id="clearConfirmDialog">
  <div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <div class="modal-title" style="text-align:center">清空历史</div>
    <div class="modal-desc">确定要清空所有会话历史吗？此操作不可撤销。</div>
    <div class="modal-actions" style="justify-content:center">
      <button class="modal-btn modal-btn-cancel" onclick="closeClearConfirmDialog()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="confirmClearHistory()">确认清空</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Data =====
let sessions = [];
let currentSessionId = '';
let messages = {};
let renamingSessionId = null;
let deletingSessionId = null;
let isTyping = false;

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function formatDate() {
  const now = new Date();
  const mon = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  return '2025-' + mon + '-' + day + ' ' + h + ':' + m;
}

function createSession(name) {
  return { id: generateId(), name: name, time: formatDate() };
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = '✓ ' + msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

// ===== Session List =====
function renderSessions() {
  const list = document.getElementById('sessionList');
  if (sessions.length === 0) {
    list.innerHTML = '<div class="session-empty">暂无历史会话</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const active = s.id === currentSessionId ? ' active' : '';
    return '<div class="session-item' + active + '" data-id="' + s.id + '" onclick="switchSession(\'' + s.id + '\')">' +
      '<div class="session-info">' +
        '<span class="session-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="session-time">' + s.time + '</span>' +
      '</div>' +
      '<div class="session-actions">' +
        '<button class="session-action-btn" onclick="event.stopPropagation();openRenameModal(\'' + s.id + '\')" title="重命名">✏️</button>' +
        '<button class="session-action-btn" onclick="event.stopPropagation();confirmDelete(\'' + s.id + '\')" title="删除">🗑️</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function switchSession(id) {
  if (isTyping) return;
  currentSessionId = id;
  renderSessions();
  updateChatTitle();
  renderMessages();
}

function updateChatTitle() {
  const s = sessions.find(s => s.id === currentSessionId);
  document.getElementById('chatTitle').textContent = s ? s.name : 'AI 评测师';
}

// ===== Messages =====
function renderMessages() {
  const container = document.getElementById('messageContainer');
  const empty = document.getElementById('messageEmpty');
  const msgs = messages[currentSessionId] || [];
  
  container.innerHTML = '';
  if (msgs.length === 0) {
    container.appendChild(empty);
    return;
  }
  
  msgs.forEach((msg, idx) => {
    const row = document.createElement('div');
    row.className = 'message-row ' + (msg.role === 'user' ? 'message-row-user' : 'message-row-ai');
    
    if (msg.role === 'ai') {
      row.innerHTML = '<div class="avatar-col"><div class="avatar ai-avatar">AI</div></div>';
    }
    
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble ' + (msg.role === 'user' ? 'bubble-user' : 'bubble-ai');
    
    const text = document.createElement('div');
    text.className = 'message-text';
    text.textContent = msg.content;
    
    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = msg.time;
    
    bubble.appendChild(text);
    bubble.appendChild(time);
    
    // Message actions
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    actions.innerHTML = '<button class="msg-action-btn" onclick="copyMessage(this)" title="复制">📋</button>' +
      '<button class="msg-action-btn" onclick="rateMessage(this,1)" title="👍">👍</button>' +
      '<button class="msg-action-btn" onclick="rateMessage(this,0)" title="👎">👎</button>';
    bubble.appendChild(actions);
    
    row.appendChild(bubble);
    
    if (msg.role === 'user') {
      row.innerHTML += '<div class="avatar-col"><div class="avatar user-avatar">我</div></div>';
    }
    
    container.appendChild(row);
  });
  
  scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('messageContainer');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
}

function getCurrentMessages() {
  if (!messages[currentSessionId]) messages[currentSessionId] = [];
  return messages[currentSessionId];
}

// ===== New Chat =====
function handleNewChat() {
  if (isTyping) return;
  const session = createSession('新对话 ' + (sessions.length + 1));
  sessions.unshift(session);
  messages[session.id] = [];
  currentSessionId = session.id;
  renderSessions();
  updateChatTitle();
  renderMessages();
  showToast('已创建新对话');
}

// ===== Send Message =====
function onInputChange(el) {
  // Auto resize
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 144) + 'px';
  document.getElementById('sendBtn').disabled = !el.value.trim();
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
}

async function handleSend() {
  const textarea = document.getElementById('inputText');
  const text = textarea.value.trim();
  if (!text || isTyping) return;
  
  textarea.value = '';
  textarea.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  
  if (!currentSessionId || !sessions.find(s => s.id === currentSessionId)) {
    const session = createSession('新对话 ' + (sessions.length + 1));
    sessions.unshift(session);
    currentSessionId = session.id;
    messages[currentSessionId] = [];
    renderSessions();
    updateChatTitle();
  }
  
  // Add user message
  const userMsg = { role: 'user', content: text, time: formatTime() };
  getCurrentMessages().push(userMsg);
  renderMessages();
  
  // Show typing indicator
  showTypingIndicator();
  isTyping = true;
  
  // Simulate AI response with typewriter effect
  const responses = [
    '您好！我已收到您的问题：「' + text + '」\n\n作为 AI 评测师，我将对您的测试场景进行分析。以下是我的初步评估：\n\n**1. 覆盖范围分析**\n✅ 正向测试场景覆盖合理\n⚠️ 需补充以下边界情况：\n  - 输入参数值为空时的处理逻辑\n  - 并发请求下的数据一致性\n  - 异常网络环境重试机制\n\n**2. 优先级建议**\nP0 核心业务流应优先覆盖，P1 异常分支次之，P2 体验优化可延后。\n\n**3. 风险提示**\n建议关注数据完整性校验用例的完整性。',
    '收到您的分析需求，正在进行详细评估。\n\n## 综合评审结果\n\n| 评估维度 | 评分 | 建议 |\n|---------|------|------|\n| 功能覆盖 | 85/100 | 补充异常场景 |\n| 数据校验 | 72/100 | 需加强边界测试 |\n| 性能考量 | 68/100 | 建议增加压力测试 |\n| 安全测试 | 78/100 | SQL注入场景待补充 |\n\n### 优化建议\n1. 增加对超时场景的测试\n2. 补充多用户并发操作测试\n3. 完善接口幂等性验证',
    '感谢您的提问。我正在对测试场景进行全面评测，以下为详细分析报告：\n\n📋 **用例质量得分**: **83/100**\n\n**优势项** ✅\n- 业务路径覆盖完整\n- 预期结果定义清晰\n- 测试数据设计合理\n\n**待改进项** ⚠️\n- 缺少异常恢复验证\n- 未覆盖降级方案\n- 可测性文档补充\n\n**建议措施**: 建议优先补充 P0 级别的异常场景用例，确保核心功能的健壮性。'
  ];
  
  const reply = responses[Math.floor(Math.random() * responses.length)];
  
  // Typewriter delay
  setTimeout(() => {
    removeTypingIndicator();
    
    const aiMsg = { role: 'ai', content: reply, time: formatTime() };
    getCurrentMessages().push(aiMsg);
    renderMessages();
    isTyping = false;
    scrollToBottom();
  }, 1200);
}

function showTypingIndicator() {
  const container = document.getElementById('messageContainer');
  const empty = document.getElementById('messageEmpty');
  
  // Remove empty state if present
  if (container.contains(empty)) {
    empty.remove();
  }
  
  const row = document.createElement('div');
  row.className = 'message-row message-row-ai';
  row.id = 'typingRow';
  row.innerHTML = '<div class="avatar-col"><div class="avatar ai-avatar">AI</div></div>' +
    '<div class="message-bubble bubble-ai"><div class="typing-indicator">' +
    '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
    '</div></div>';
  container.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

// ===== Message Actions =====
function copyMessage(btn) {
  const bubble = btn.closest('.message-bubble');
  const text = bubble.querySelector('.message-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板');
  });
}

function rateMessage(btn, type) {
  const label = type === 1 ? '👍' : '👎';
  showToast('已反馈 ' + label);
}

// ===== Rename =====
function openRenameModal(id) {
  const s = sessions.find(s => s.id === id);
  if (!s) return;
  renamingSessionId = id;
  document.getElementById('renameInput').value = s.name;
  document.getElementById('renameModal').className = 'modal-overlay open';
  setTimeout(() => document.getElementById('renameInput').focus(), 100);
}

function closeRenameModal() {
  document.getElementById('renameModal').className = 'modal-overlay';
  renamingSessionId = null;
}

function confirmRename() {
  const input = document.getElementById('renameInput');
  const val = input.value.trim();
  if (val) {
    const s = sessions.find(s => s.id === renamingSessionId);
    if (s) {
      s.name = val;
      renderSessions();
      updateChatTitle();
      showToast('已重命名');
    }
  }
  closeRenameModal();
}

// ===== Delete =====
function confirmDelete(id) {
  deletingSessionId = id;
  document.getElementById('confirmDialog').className = 'modal-overlay confirm-dialog open';
}

function closeConfirmDialog() {
  document.getElementById('confirmDialog').className = 'modal-overlay confirm-dialog';
  deletingSessionId = null;
}

function confirmDeleteSession() {
  if (!deletingSessionId) return;
  sessions = sessions.filter(s => s.id !== deletingSessionId);
  delete messages[deletingSessionId];
  if (currentSessionId === deletingSessionId) {
    currentSessionId = sessions[0]?.id || '';
  }
  deletingSessionId = null;
  renderSessions();
  updateChatTitle();
  renderMessages();
  closeConfirmDialog();
  showToast('会话已删除');
}

// ===== Clear =====
function confirmClear() {
  document.getElementById('clearConfirmDialog').className = 'modal-overlay confirm-dialog open';
}

function closeClearConfirmDialog() {
  document.getElementById('clearConfirmDialog').className = 'modal-overlay confirm-dialog';
}

function confirmClearHistory() {
  sessions = [];
  messages = {};
  currentSessionId = '';
  renderSessions();
  updateChatTitle();
  renderMessages();
  closeClearConfirmDialog();
  showToast('历史已清空');
}

// ===== Init =====
(function init() {
  // Create initial session
  const session = createSession('API 接口测试评审');
  sessions.push(session);
  currentSessionId = session.id;
  messages[session.id] = [
    { role: 'ai', content: '您好！我是 AI 评测师，可以协助您评审测试用例、分析测试结果、优化测试策略。请描述您需要评测的内容。', time: formatTime() },
    { role: 'user', content: '请帮我评审一下用户登录模块的测试用例覆盖情况', time: formatTime() },
    { role: 'ai', content: '好的，我来分析用户登录模块的测试用例覆盖情况。\n\n## 登录模块用例评审报告\n\n### ✅ 已有用例覆盖\n- 正常用户名密码登录\n- 密码错误提示\n- 用户名不存在处理\n- 多次失败锁定\n\n### ⚠️ 建议补充\n1. **SSO单点登录** - 缺少第三方认证的测试\n2. **Token过期刷新** - 需验证refresh token机制\n3. **并发登录** - 同一账号多地登录场景\n4. **密码策略** - 弱密码检测、历史密码复用\n\n### 📊 综合评分: **78/100**\n整体覆盖度良好，建议优先补充安全相关场景。', time: formatTime() }
  ];
  
  // Create additional sessions
  const extraSessions = [
    { name: '用户登录模块用例评审', time: '2025-06-12 11:20' },
    { name: '订单流程边界分析', time: '2025-06-11 16:45' },
    { name: '支付系统安全性评估', time: '2025-06-11 10:30' },
    { name: '性能测试场景设计评估', time: '2025-06-10 14:00' }
  ];
  
  extraSessions.forEach(s => {
    const sess = createSession(s.name);
    sess.time = s.time;
    sessions.push(sess);
    messages[sess.id] = [];
  });
  
  renderSessions();
  renderMessages();
})();
</script>
