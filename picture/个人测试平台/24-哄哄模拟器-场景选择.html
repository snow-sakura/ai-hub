<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄哄模拟器 - 场景选择</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #FBF7F0;
  color: #3D2E1F;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
/* Nav */
.navbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: #FFFDF9;
  border-bottom: 1px solid rgba(180,150,120,0.12);
  position: sticky; top: 0; z-index: 100;
}
.nav-back {
  display: flex; align-items: center; gap: 4px;
  color: #8B7355; font-size: 14px; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; transition: all 0.2s;
}
.nav-back:hover { background: rgba(198,123,92,0.08); color: #C67B5C; }
.nav-title { flex: 1; font-size: 18px; font-weight: 600; color: #3D2E1F; }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.nav-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(180,150,120,0.15);
  background: #FFFDF9; color: #8B7355; font-size: 13px; cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:hover { background: rgba(198,123,92,0.08); color: #C67B5C; border-color: #C67B5C; }
.nav-btn-primary {
  background: #C67B5C; color: white; border-color: #C67B5C;
}
.nav-btn-primary:hover { background: #B56A4A; color: white; }

/* Content */
.content {
  flex: 1; overflow-y: auto; padding: 0 20px 80px;
  max-width: 600px; margin: 0 auto; width: 100%;
}

/* Hero */
.hero {
  margin: 20px 0; padding: 28px 24px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(198,123,92,0.08), rgba(212,165,116,0.08));
  border: 1px solid rgba(180,150,120,0.12);
  text-align: center; position: relative; overflow: hidden;
}
.hero emoji-bg {
  position: absolute; font-size: 28px; opacity: 0.5;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(8deg); }
}
.hero-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; position: relative; z-index: 1; }
.hero-desc { font-size: 14px; color: #8B7355; line-height: 1.6; position: relative; z-index: 1; }

/* Sections */
.section { margin: 24px 0 20px; }
.section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.section-step {
  width: 24px; height: 24px; border-radius: 50%; background: #C67B5C;
  color: white; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.section-title { font-size: 16px; font-weight: 600; }

/* Scene Cards */
.scene-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 12px;
  border: 1px solid rgba(180,150,120,0.12);
  background: #FFFDF9; cursor: pointer;
  transition: all 0.25s; margin-bottom: 10px;
}
.scene-card:hover { box-shadow: 0 4px 14px rgba(60,40,20,0.06); transform: translateY(-1px); }
.scene-card.active {
  border-left: 3px solid #C67B5C; background: rgba(198,123,92,0.05);
  box-shadow: 0 2px 8px rgba(198,123,92,0.12);
}
.scene-emoji { font-size: 28px; width: 40px; text-align: center; }
.scene-info { flex: 1; min-width: 0; }
.scene-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.scene-desc { font-size: 13px; color: #8B7355; }
.scene-stars { color: #D4A574; font-size: 13px; letter-spacing: 1px; }

/* Role Cards */
.role-list { display: flex; flex-direction: column; gap: 10px; }
.role-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 12px;
  border: 1px solid rgba(180,150,120,0.12);
  background: #FFFDF9; cursor: pointer;
  transition: all 0.25s;
  animation: fadeInUp 0.4s ease both;
}
.role-card:nth-child(2) { animation-delay: 0.1s; }
.role-card:nth-child(3) { animation-delay: 0.2s; }
.role-card:nth-child(4) { animation-delay: 0.3s; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.role-card:hover { box-shadow: 0 4px 14px rgba(60,40,20,0.06); transform: translateY(-1px); }
.role-card.active {
  border-left: 3px solid #C67B5C; background: rgba(198,123,92,0.05);
}
.role-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #C67B5C, #D4A574);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: white; flex-shrink: 0;
}
.role-info { flex: 1; min-width: 0; }
.role-name { font-size: 15px; font-weight: 600; }
.role-identity { font-size: 12px; color: #8B7355; margin: 2px 0 6px; }
.role-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.role-tag {
  padding: 2px 10px; border-radius: 12px; font-size: 11px;
  background: rgba(198,123,92,0.1); color: #C67B5C;
}
.role-arrow { color: #B5A590; font-size: 16px; }

/* Difficulty */
.difficulty-row {
  display: flex; align-items: center; gap: 16px; margin-top: 8px;
}
.star-rating {
  display: flex; gap: 4px; cursor: pointer;
}
.star-rating .star {
  font-size: 22px; color: #E0D5C8; transition: all 0.2s;
  cursor: pointer;
}
.star-rating .star.active, .star-rating .star:hover { color: #D4A574; }
.difficulty-label {
  font-size: 14px; font-weight: 500; color: #8B7355;
}

/* Bottom btn */
.bottom-bar {
  position: sticky; bottom: 0; padding: 12px 20px;
  background: linear-gradient(to top, #FBF7F0 80%, transparent);
}
.start-btn {
  display: block; width: 100%; max-width: 600px; margin: 0 auto;
  padding: 14px; border: none; border-radius: 12px;
  background: #C67B5C; color: white; font-size: 16px; font-weight: 600;
  cursor: pointer; box-shadow: 0 4px 14px rgba(198,123,92,0.3);
  transition: all 0.25s;
}
.start-btn:hover {
  background: #B56A4A; transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(198,123,92,0.4);
}
</style>
</head>
<body>

<div class="navbar">
  <div class="nav-back">← 返回</div>
  <div class="nav-title">🎭 哄哄模拟器</div>
  <div class="nav-actions">
    <button class="nav-btn">📊</button>
    <button class="nav-btn nav-btn-primary">重新开始</button>
  </div>
</div>

<div class="content">
  <!-- Hero -->
  <div class="hero">
    <div class="emoji-bg" style="position:absolute;top:10px;left:15px;">💕</div>
    <div class="emoji-bg" style="position:absolute;top:8px;right:20px;animation-delay:0.5s;">💖</div>
    <div class="emoji-bg" style="position:absolute;bottom:12px;left:40%;animation-delay:1s;">💗</div>
    <div class="hero-title">学习如何安慰别人</div>
    <div class="hero-desc">
      选择场景和角色，开始你的安慰之旅。AI 会模拟真实情绪反应，并实时分析你的安慰效果。
    </div>
  </div>

  <!-- Step 1: Scene -->
  <div class="section">
    <div class="section-header">
      <span class="section-step">1</span>
      <span class="section-title">选择场景</span>
    </div>
    <div class="scene-card active">
      <div class="scene-emoji">💔</div>
      <div class="scene-info">
        <div class="scene-name">失恋安慰</div>
        <div class="scene-desc">帮助走出失恋阴霾</div>
      </div>
      <div class="scene-stars">★★★★☆</div>
    </div>
    <div class="scene-card">
      <div class="scene-emoji">💼</div>
      <div class="scene-info">
        <div class="scene-name">工作压力</div>
        <div class="scene-desc">缓解职场压力</div>
      </div>
      <div class="scene-stars">★★★☆☆</div>
    </div>
    <div class="scene-card">
      <div class="scene-emoji">🏠</div>
      <div class="scene-info">
        <div class="scene-name">家庭矛盾</div>
        <div class="scene-desc">化解家庭冲突</div>
      </div>
      <div class="scene-stars">★★★★★</div>
    </div>
  </div>

  <!-- Step 2: Role -->
  <div class="section">
    <div class="section-header">
      <span class="section-step">2</span>
      <span class="section-title">选择角色</span>
    </div>
    <div class="role-list">
      <div class="role-card active">
        <div class="role-avatar">👩</div>
        <div class="role-info">
          <div class="role-name">林小雨</div>
          <div class="role-identity">你的高中同学</div>
          <div class="role-tags">
            <span class="role-tag">敏感</span>
            <span class="role-tag">内向</span>
            <span class="role-tag">温柔</span>
          </div>
        </div>
        <div class="role-arrow">›</div>
      </div>
      <div class="role-card">
        <div class="role-avatar">👨</div>
        <div class="role-info">
          <div class="role-name">张明远</div>
          <div class="role-identity">你的工作搭档</div>
          <div class="role-tags">
            <span class="role-tag">完美主义</span>
            <span class="role-tag">焦虑</span>
            <span class="role-tag">理性</span>
          </div>
        </div>
        <div class="role-arrow">›</div>
      </div>
      <div class="role-card">
        <div class="role-avatar">👴</div>
        <div class="role-info">
          <div class="role-name">王建国</div>
          <div class="role-identity">你的父亲</div>
          <div class="role-tags">
            <span class="role-tag">固执</span>
            <span class="role-tag">传统</span>
            <span class="role-tag">关爱</span>
          </div>
        </div>
        <div class="role-arrow">›</div>
      </div>
      <div class="role-card">
        <div class="role-avatar">👩‍💼</div>
        <div class="role-info">
          <div class="role-name">陈总监</div>
          <div class="role-identity">你的直属上级</div>
          <div class="role-tags">
            <span class="role-tag">严厉</span>
            <span class="role-tag">高压</span>
            <span class="role-tag">望子成龙</span>
          </div>
        </div>
        <div class="role-arrow">›</div>
      </div>
    </div>
  </div>

  <!-- Step 3: Difficulty -->
  <div class="section">
    <div class="section-header">
      <span class="section-step">3</span>
      <span class="section-title">选择难度</span>
    </div>
    <div class="difficulty-row">
      <div class="star-rating">
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
      </div>
      <span class="difficulty-label">普通</span>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button class="start-btn">开始哄哄 💕</button>
</div>

</body>
</html>
