<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI环境配置 · AI-HUB 智能工作台</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--danger:#D4745C;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:ui-monospace,'SF Mono','Fira Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(180,150,120,0.2);border-radius:10px}::-webkit-scrollbar-track{background:transparent}
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px 14px;font-size:16px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-group{margin-bottom:4px}
.menu-group-title{padding:12px 20px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
.menu-item{display:flex;align-items:center;padding:9px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.15s}
.menu-item:hover{background:var(--primary-bg)}.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:var(--border);font-size:12px;color:var(--text-muted)}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-btn{width:32px;height:32px;border-radius:6px;border:var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s}
.topbar-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.content{padding:24px;flex:1}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:var(--text);margin:0;letter-spacing:-0.02em}
.page-sub{font-size:13px;color:var(--text-muted);margin:6px 0 0}
.header-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 18px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);box-shadow:0 2px 8px rgba(198,123,92,0.25)}
.btn-secondary{background:transparent;color:var(--text-secondary);border:var(--border)}.btn-secondary:hover{background:var(--primary-bg);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(180,150,120,0.15)}.btn-ghost:hover{background:rgba(0,0,0,0.04)}
.btn-sm{height:28px;padding:0 12px;font-size:12px}.btn-xs{height:24px;padding:0 8px;font-size:11px}
.card{background:var(--card-bg);border:var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:14px;font-weight:600;color:var(--text);border-bottom:var(--border)}
.card-body{padding:16px 20px}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.env-card{background:var(--card-bg);border:var(--border);border-radius:12px;overflow:hidden;transition:all 0.2s}
.env-card:hover{box-shadow:var(--shadow)}
.env-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:var(--border)}
.env-head:hover{background:var(--primary-bg)}
.env-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.env-body{padding:14px 16px}
.env-info-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px}
.env-label{color:var(--text-muted)}.env-value{color:var(--text);font-weight:500;font-family:var(--font-mono);font-size:12px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-global{background:rgba(198,123,92,0.12);color:var(--primary)}
.tag-local{background:rgba(91,141,239,0.12);color:var(--info)}
.tag-active{background:rgba(123,168,125,0.12);color:var(--success)}
.tag-inactive{background:rgba(180,150,120,0.12);color:var(--text-muted)}
.kv-table{width:100%;border-collapse:collapse;font-size:13px}
.kv-table th{text-align:left;padding:8px 10px;font-weight:600;color:var(--text-secondary);border-bottom:var(--border);font-size:12px;background:var(--sidebar-bg)}
.kv-table td{padding:8px 10px;border-bottom:var(--border);color:var(--text);font-family:var(--font-mono);font-size:12px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,20,10,0.35);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card-bg);border-radius:14px;width:92%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(30,20,10,0.18);animation:modalIn 0.2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px}
.modal-close:hover{background:var(--primary-bg);color:var(--text)}
.modal-body{padding:20px}.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:var(--border)}
.input{width:100%;height:34px;border:var(--border);border-radius:6px;padding:0 12px;font-size:13px;color:var(--text);font-family:inherit;background:var(--card-bg);outline:none}
.input:focus{border-color:var(--primary)}.textarea{width:100%;height:60px;border:var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text);font-family:var(--font-mono);background:var(--card-bg);outline:none;resize:vertical}
.textarea:focus{border-color:var(--primary)}label{font-size:13px;color:var(--text-secondary);margin-bottom:4px;display:block}.mb-2{margin-bottom:12px}
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 30px rgba(30,20,10,0.12);display:flex;align-items:center;gap:10px;font-size:13px;animation:slideIn 0.25s ease;max-width:360px}
.toast-success{border-left:4px solid var(--success)}.toast-info{border-left:4px solid var(--info)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.env-grid{grid-template-columns:1fr}}
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:14px 0;justify-content:center}.menu-item{justify-content:center;padding:9px 0}.main{margin-left:60px}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo" onclick="location.href='41-home-cards.html'"><div class="logo-icon">🖥️</div><span>UI 自动化</span></div>
  <nav class="sidebar-menu">
    <div class="menu-group"><div class="menu-group-title">UI 自动化</div>
    <a class="menu-item" href="52-UI自动化模块.html"><span class="icon">📊</span><span>模块概览</span></a>
    <a class="menu-item" href="13-UI仪表盘.html"><span class="icon">📊</span><span>数据看板</span></a>
    <a class="menu-item" href="14-UI元素管理.html"><span class="icon">🔧</span><span>元素管理</span></a>
    <a class="menu-item" href="15-UI用例管理.html"><span class="icon">📋</span><span>测试用例</span></a>
    <a class="menu-item" href="16-UI录制器.html"><span class="icon">⏺️</span><span>用例录制</span></a>
    <a class="menu-item" href="17-UI测试套件.html"><span class="icon">📦</span><span>测试套件</span></a>
    <a class="menu-item" href="18-UI执行记录.html"><span class="icon">▶️</span><span>执行记录</span></a>
    <a class="menu-item" href="19-UI测试报告.html"><span class="icon">📈</span><span>测试报告</span></a>
    <a class="menu-item" href="22-UI设备管理.html"><span class="icon">📱</span><span>设备管理</span></a>
    <a class="menu-item" href="20-UI定时任务.html"><span class="icon">⏰</span><span>定时任务</span></a>
    <a class="menu-item active" href="21-UI环境管理.html"><span class="icon">🌐</span><span>测试环境</span></a>
    <a class="menu-item" href="23-UI通知.html"><span class="icon">🔔</span><span>通知配置</span></a>
    </div>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">UI 自动化 / <span>测试环境</span></div>
    <div class="topbar-right"><button class="topbar-btn" onclick="showToast('页面已刷新','info')" title="刷新">⟳</button><button class="topbar-btn" onclick="showToast('暂无新通知','info')" title="通知">🔔</button><div class="avatar-sm">张</div></div>
  </header>
  <div class="content">
    <div class="page-header fade-in">
      <div><h1 class="page-title">UI 环境配置</h1><p class="page-sub">管理 UI 自动化测试环境 · 共 4 个环境</p></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="showModal('envModal')">+ 新建环境</button></div>
    </div>
    <div class="env-grid fade-in" id="envGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="envModal">
  <div class="modal-box">
    <div class="modal-head"><h3>🌐 新建环境</h3><button class="modal-close" onclick="hideModal('envModal')">✕</button></div>
    <div class="modal-body">
      <label>环境名称</label><input class="input mb-2" placeholder="例如：测试环境">
      <label>基础 URL</label><input class="input mb-2" value="https://" style="font-family:var(--font-mono)">
      <label>视口宽度</label><select class="input mb-2"><option>1920</option><option>1440</option><option>1280</option><option>1024</option><option>768</option><option>375</option></select>
      <label>视口高度</label><select class="input mb-2"><option>1080</option><option>900</option><option>800</option><option>768</option><option>667</option></select>
      <label>设备像素比</label><select class="input mb-2"><option>1</option><option>2</option><option>3</option></select>
      <label>备注</label><textarea class="textarea" placeholder="环境描述..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('envModal')">取消</button>
      <button class="btn btn-primary" onclick="hideModal('envModal');showToast('环境已创建','success')">创建</button>
    </div>
  </div>
</div>

<script>
var envs = [
  {name:'开发环境',url:'https://dev.example.com',viewport:'1920×1080',dpr:1,browsers:3,vars:8,status:'active',desc:'日常开发自测环境',icon:'🔧',color:'#5B8DEF',bg:'rgba(91,141,239,0.12)'},
  {name:'测试环境',url:'https://test.example.com',viewport:'1920×1080',dpr:1,browsers:4,vars:12,status:'active',desc:'QA 测试执行环境',icon:'🧪',color:'var(--success)',bg:'rgba(123,168,125,0.12)'},
  {name:'预发布环境',url:'https://staging.example.com',viewport:'1440×900',dpr:1,browsers:2,vars:10,status:'active',desc:'上线前验证环境',icon:'🚀',color:'#D4A574',bg:'rgba(212,165,116,0.12)'},
  {name:'生产环境',url:'https://www.example.com',viewport:'1440×900',dpr:2,browsers:1,vars:5,status:'inactive',desc:'线上巡检环境（仅只读操作）',icon:'🔒',color:'var(--danger)',bg:'rgba(212,116,92,0.12)'}
];
function showModal(id){document.getElementById(id).classList.add('active')}
function hideModal(id){document.getElementById(id).classList.remove('active')}
document.querySelectorAll('.modal-overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')})});
function showToast(msg,type){type=type||'success';var t=document.createElement('div');t.className='toast toast-'+type;t.innerHTML=(type==='success'?'✅ ':'ℹ️ ')+msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}

var grid = document.getElementById('envGrid');
grid.innerHTML = envs.map(function(e){
  var v = e.vars;
  return '<div class="env-card"><div class="env-head" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">'+
    '<div class="env-icon" style="background:'+e.bg+';color:'+e.color+'">'+e.icon+'</div>'+
    '<div style="flex:1"><div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--text)">'+e.name+' <span class="tag '+(e.status==='active'?'tag-active':'tag-inactive')+'">'+(e.status==='active'?'启用':'停用')+'</span></div>'+
    '<div style="font-size:12px;color:var(--text-muted);margin-top:2px">'+e.desc+'</div></div>'+
    '<span style="font-size:12px;color:var(--text-muted)">'+(e.status==='active'?'🟢':'🔴')+'</span></div>'+
    '<div class="env-body" style="display:'+(e.status==='active'?'block':'none')+'">'+
    '<div class="env-info-row"><span class="env-label">基础 URL</span><span class="env-value">'+e.url+'</span></div>'+
    '<div class="env-info-row"><span class="env-label">视口</span><span class="env-value">'+e.viewport+'</span></div>'+
    '<div class="env-info-row"><span class="env-label">DPR</span><span class="env-value">'+e.dpr+'x</span></div>'+
    '<div style="margin-top:10px;padding-top:10px;border-top:var(--border)">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;font-weight:600;color:var(--text-secondary)">环境变量</span><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'添加变量\',\'info\')">+ 添加</button></div>'+
    '<table class="kv-table"><thead><tr><th>变量名</th><th>值</th><th>操作</th></tr></thead><tbody>'+
    (function(){ var rows='';var items=[{k:'BASE_URL',v:e.url},{k:'VIEWPORT',v:e.viewport},{k:'BROWSER',v:'Chrome'},{k:'TIMEOUT',v:'30000'}];for(var i=0;i<items.length&&i<3;i++){rows+='<tr><td>'+items[i].k+'</td><td style="color:var(--text-muted)">'+items[i].v+'</td><td><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'已删除\',\'info\')">✕</button></td></tr>'};return rows })()+
    (e.vars>4?'<tr><td colspan="3" style="text-align:center;color:var(--text-muted);font-family:var(--font);font-size:12px">... 还有 '+(e.vars-4)+' 个变量</td></tr>':'')+
    '</tbody></table>'+
    '<div style="margin-top:8px;display:flex;gap:6px">'+
    '<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'保存成功\',\'success\')">💾 保存</button>'+
    '<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'已复制\',\'info\')">📋 测试连接</button>'+
    '</div></div></div></div>';
}).join('');
</script>
</body>
</html>
