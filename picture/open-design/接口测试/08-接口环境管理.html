<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境管理 · AI-HUB 智能工作台</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--danger:#D4745C;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:ui-monospace,'SF Mono','Fira Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(180,150,120,0.2);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px 14px;font-size:16px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-group{margin-bottom:4px}
.menu-group-title{padding:12px 20px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
.menu-item{display:flex;align-items:center;padding:9px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.15s}
.menu-item:hover{background:var(--primary-bg)}
.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:var(--border);font-size:12px;color:var(--text-muted)}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}
.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-btn{width:32px;height:32px;border-radius:6px;border:var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s}
.topbar-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.content{padding:24px;flex:1}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:var(--text);margin:0;letter-spacing:-0.02em}
.page-sub{font-size:13px;color:var(--text-muted);margin:6px 0 0}
.header-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 18px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light);box-shadow:0 2px 8px rgba(198,123,92,0.25)}
.btn-secondary{background:transparent;color:var(--text-secondary);border:var(--border)}
.btn-secondary:hover{background:var(--primary-bg);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(180,150,120,0.15)}
.btn-ghost:hover{background:rgba(0,0,0,0.04)}
.btn-sm{height:28px;padding:0 12px;font-size:12px}
.btn-xs{height:24px;padding:0 8px;font-size:11px}
.card{background:var(--card-bg);border:var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.env-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.env-card{background:var(--card-bg);border:var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;overflow:hidden}
.env-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.env-card-header{display:flex;align-items:center;gap:10px;padding:14px 16px;justify-content:space-between}
.env-card-left{display:flex;align-items:center;gap:10px}
.env-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
.env-name{font-size:14px;font-weight:600;color:var(--text)}
.env-type-tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:500}
.env-type-global{background:rgba(198,123,92,0.12);color:var(--primary)}
.env-type-local{background:rgba(180,150,120,0.12);color:var(--text-muted)}
.env-card-body{padding:0 16px 14px}
.env-stat{font-size:12px;color:var(--text-muted)}
.env-stat strong{color:var(--text-secondary);font-family:var(--font-mono);font-size:11px}
.env-detail{padding:14px 16px;border-top:var(--border);background:rgba(180,150,120,0.03)}
.env-detail.collapsed{display:none}
.kv-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.kv-row input{flex:1;height:30px;border:var(--border);border-radius:5px;padding:0 10px;font-size:12px;font-family:var(--font-mono);color:var(--text);background:var(--card-bg);outline:none}
.kv-row input:focus{border-color:var(--primary)}
.ref-box{padding:10px 14px;background:rgba(198,123,92,0.06);border-radius:6px;font-size:12px;color:var(--text-secondary);margin-top:10px}
.ref-code{background:rgba(198,123,92,0.1);padding:2px 8px;border-radius:4px;font-family:var(--font-mono);color:var(--primary);font-size:11px}
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 30px rgba(30,20,10,0.12);display:flex;align-items:center;gap:10px;font-size:13px;animation:slideIn 0.25s ease;max-width:360px}
.toast-success{border-left:4px solid var(--success)}
.toast-info{border-left:4px solid var(--info)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.env-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:14px 0;justify-content:center}.menu-item{justify-content:center;padding:9px 0}.main{margin-left:60px}.env-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo" onclick="location.href='41-home-cards.html'"><div class="logo-icon">🔌</div><span>接口测试</span></div>
  <nav class="sidebar-menu">
    <div class="menu-group"><div class="menu-group-title">接口测试</div>
    <a class="menu-item" href="51-接口测试模块.html"><span class="icon">📊</span><span>模块概览</span></a>
    <a class="menu-item" href="05-接口仪表盘.html"><span class="icon">📊</span><span>数据看板</span></a>
    <a class="menu-item" href="06-接口管理.html"><span class="icon">🔗</span><span>接口管理</span></a>
    <a class="menu-item" href="07-接口自动化.html"><span class="icon">⚡</span><span>自动化测试</span></a>
    <a class="menu-item active" href="08-接口环境管理.html"><span class="icon">🌐</span><span>环境管理</span></a>
    <a class="menu-item" href="09-接口请求历史.html"><span class="icon">📜</span><span>请求历史</span></a>
    <a class="menu-item" href="10-Mock服务.html"><span class="icon">🎭</span><span>Mock服务</span></a>
    <a class="menu-item" href="11-接口定时任务.html"><span class="icon">⏰</span><span>定时任务</span></a>
    <a class="menu-item" href="12-接口通知.html"><span class="icon">🔔</span><span>通知配置</span></a>
    </div>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">接口测试 / <span>环境管理</span></div>
    <div class="topbar-right"><button class="topbar-btn" onclick="showToast('页面已刷新','info')" title="刷新">⟳</button><button class="topbar-btn" onclick="showToast('暂无新通知','info')" title="通知">🔔</button><div class="avatar-sm">张</div></div>
  </header>
  <div class="content">
    <div class="page-header fade-in">
      <div><h1 class="page-title">环境管理</h1><p class="page-sub">管理 API 测试环境配置 · 共 4 个环境</p></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="showToast('新建环境','info')">+ 新建环境</button></div>
    </div>
    <div class="env-grid fade-in" id="envGrid"></div>
  </div>
</div>
<script>
var envs = [
  { id:1, icon:'🟢', name:'开发环境', type:'global', active:true, baseUrl:'http://dev-api.example.com', vars:[
    { key:'base_url', value:'http://dev-api.example.com', desc:'基础地址' },
    { key:'api_key', value:'dev_test_key_123', desc:'测试 API Key' },
    { key:'timeout', value:'30000', desc:'超时时间(ms)' }
  ], expanded:false },
  { id:2, icon:'🟡', name:'测试环境', type:'global', active:true, baseUrl:'http://test-api.example.com', vars:[
    { key:'base_url', value:'http://test-api.example.com', desc:'基础地址' },
    { key:'api_key', value:'test_env_key_456', desc:'测试 API Key' },
    { key:'timeout', value:'15000', desc:'超时时间(ms)' }
  ], expanded:false },
  { id:3, icon:'🟠', name:'预发布环境', type:'global', active:false, baseUrl:'https://staging-api.example.com', vars:[
    { key:'base_url', value:'https://staging-api.example.com', desc:'基础地址' },
    { key:'api_key', value:'staging_key_789', desc:'预发布 Key' }
  ], expanded:false },
  { id:4, icon:'🔴', name:'生产环境', type:'local', active:false, baseUrl:'https://api.example.com', vars:[
    { key:'base_url', value:'https://api.example.com', desc:'基础地址' },
    { key:'api_key', value:'****', desc:'生产 Key (已加密)' }
  ], expanded:false }
];

function renderEnvs() {
  var grid = document.getElementById('envGrid');
  grid.innerHTML = envs.map(function(e, i) {
    var activeHtml = '<label style="cursor:pointer" onclick="event.stopPropagation()">' +
      '<input type="checkbox" '+(e.active?'checked':'')+' onchange="toggleEnvActive('+i+')" style="accent-color:#C67B5C">' +
      '</label>';
    var typeTag = e.type === 'global' ? '<span class="env-type-tag env-type-global">Global</span>' : '<span class="env-type-tag env-type-local">Local</span>';
    var varsHtml = e.vars.map(function(v, vi) {
      return '<div class="kv-row"><input value="'+v.key+'" placeholder="变量名"><input value="'+v.value+'" placeholder="变量值"><input value="'+v.desc+'" placeholder="描述" style="flex:0.6"><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();removeVar('+i+','+vi+')">✕</button></div>';
    }).join('');
    var detailHtml = e.expanded ? (
      '<div class="env-detail">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text)">环境变量</div>'+
        '<div id="vars_'+i+'">'+varsHtml+'</div>'+
        '<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();addVar('+i+')" style="margin-top:4px">+ 新增变量</button>'+
        '<div class="ref-box">变量引用示例：<code class="ref-code">{{base_url}}</code> 会在请求时自动替换为对应值</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();showToast(\'环境已保存\',\'success\')">💾 保存环境</button></div>'+
      '</div>'
    ) : '';
    return '<div class="env-card" onclick="toggleEnv('+i+')">'+
      '<div class="env-card-header">'+
        '<div class="env-card-left"><span class="env-icon" style="background:rgba(180,150,120,0.1)">'+e.icon+'</span><span class="env-name">'+e.name+'</span>'+typeTag+'</div>'+
        activeHtml+
      '</div>'+
      '<div class="env-card-body"><div class="env-stat">变量 <strong>'+e.vars.length+'</strong> 个 · 地址 <strong>'+e.baseUrl+'</strong></div></div>'+
      detailHtml+
    '</div>';
  }).join('');
}

function toggleEnv(idx) { envs[idx].expanded = !envs[idx].expanded; renderEnvs(); }
function toggleEnvActive(idx) { envs[idx].active = !envs[idx].active; renderEnvs(); showToast(envs[idx].name+' 已'+(envs[idx].active?'启用':'停用'),'success'); }
function addVar(idx) { envs[idx].vars.push({key:'',value:'',desc:''}); renderEnvs(); }
function removeVar(idx, vi) { envs[idx].vars.splice(vi,1); renderEnvs(); }
function showToast(msg,type){type=type||'success';var t=document.createElement('div');t.className='toast toast-'+type;t.innerHTML=(type==='success'?'✅ ':'ℹ️ ')+msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}
renderEnvs();
</script>
</body>
</html>
