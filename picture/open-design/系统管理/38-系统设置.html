<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 · AI-HUB 智能工作台</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--danger:#D4745C;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:ui-monospace,'SF Mono','Fira Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px 14px;font-size:16px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-group-title{padding:12px 20px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
.menu-item{display:flex;align-items:center;padding:9px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.15s}
.menu-item:hover{background:var(--primary-bg)}.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:var(--border);font-size:12px;color:var(--text-muted)}
.main{margin-left:240px;flex:1}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-btn{width:32px;border-radius:6px;border:var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;height:32px}
.topbar-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.content{padding:24px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:var(--text)}.page-sub{font-size:13px;color:var(--text-muted);margin:6px 0 0}
.header-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 18px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);box-shadow:0 2px 8px rgba(198,123,92,0.25)}
.btn-secondary{background:transparent;color:var(--text-secondary);border:var(--border)}.btn-secondary:hover{background:var(--primary-bg);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(180,150,120,0.15)}.btn-ghost:hover{background:rgba(0,0,0,0.04)}
.btn-sm{height:28px;padding:0 12px;font-size:12px}
.card{background:var(--card-bg);border:var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:14px;font-weight:600;color:var(--text);border-bottom:var(--border)}
.card-body{padding:16px 20px}
.form-group{margin-bottom:14px}
.form-group label{font-size:13px;color:var(--text-secondary);margin-bottom:4px;display:block}
.form-group .hint{font-size:12px;color:var(--text-muted);margin-top:4px}
.input{width:100%;height:34px;border:var(--border);border-radius:6px;padding:0 12px;font-size:13px;color:var(--text);font-family:inherit;background:var(--card-bg);outline:none}
.input:focus{border-color:var(--primary)}select.input{appearance:auto}
.textarea{width:100%;height:80px;border:var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text);font-family:var(--font-mono);background:var(--card-bg);outline:none;resize:vertical}
.textarea:focus{border-color:var(--primary)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-active{background:rgba(123,168,125,0.12);color:var(--success)}
.tab-bar{display:flex;gap:0;margin-bottom:0;border-bottom:var(--border);background:var(--sidebar-bg);border-radius:12px 12px 0 0}
.tab-item{padding:10px 20px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.tab-item:hover{color:var(--text-secondary);background:var(--primary-bg)}
.tab-item.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--card-bg);font-weight:600}
.tab-content{display:none}.tab-content.active{display:block}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 30px rgba(30,20,10,0.12);display:flex;align-items:center;gap:10px;font-size:13px;animation:slideIn 0.25s ease;max-width:360px}
.toast-success{border-left:4px solid var(--success)}.toast-info{border-left:4px solid var(--info)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:14px 0;justify-content:center}.menu-item{justify-content:center;padding:9px 0}.main{margin-left:60px}.grid-2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo" onclick="location.href='41-home-cards.html'"><div class="logo-icon">⚙️</div><span>系统管理</span></div>
  <nav class="sidebar-menu">
    <div class="menu-group"><div class="menu-group-title">系统管理</div>
    <a class="menu-item" href="55-系统管理模块.html"><span class="icon">📊</span><span>模块概览</span></a>
    <a class="menu-item" href="35-配置中心.html"><span class="icon">⚙️</span><span>配置中心</span></a>
    <a class="menu-item" href="../系统管理/36-用户管理.html"><span class="icon">👥</span><span>用户管理</span></a>
    <a class="menu-item" href="37-角色权限.html"><span class="icon">🔐</span><span>角色权限</span></a>
    <a class="menu-item active" href="38-系统设置.html"><span class="icon">⚙️</span><span>系统设置</span></a>
    <a class="menu-item" href="39-审计日志.html"><span class="icon">📋</span><span>审计日志</span></a>
    <a class="menu-item" href="40-系统集成.html"><span class="icon">🔗</span><span>集成配置</span></a>
    </div>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">系统管理 / <span>系统设置</span></div>
    <div class="topbar-right"><button class="topbar-btn" onclick="showToast('页面已刷新','info')" title="刷新">⟳</button><button class="topbar-btn" onclick="showToast('暂无新通知','info')" title="通知">🔔</button><div class="avatar-sm">张</div></div>
  </header>
  <div class="content">
    <div class="page-header fade-in">
      <div><h1 class="page-title">系统设置</h1><p class="page-sub">全局参数配置</p></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="showToast('设置已保存','success')">💾 保存全部</button></div>
    </div>
    <div class="card fade-in">
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab(this,'tab-general')">⚙️ 通用设置</div>
        <div class="tab-item" onclick="switchTab(this,'tab-mail')">📧 邮件服务</div>
        <div class="tab-item" onclick="switchTab(this,'tab-llm')">🤖 LLM 配置</div>
        <div class="tab-item" onclick="switchTab(this,'tab-storage')">💾 存储设置</div>
      </div>
      <div id="tab-general" class="tab-content active"><div class="card-body">
        <div class="grid-2">
          <div class="form-group"><label>平台名称</label><input class="input" value="AI-HUB 智能工作台"><div class="hint">显示在浏览器标题和 Logo 旁</div></div>
          <div class="form-group"><label>时区</label><select class="input"><option>Asia/Shanghai (UTC+8)</option><option>Asia/Tokyo (UTC+9)</option><option>America/New_York (UTC-5)</option></select></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>语言</label><select class="input"><option>简体中文</option><option>English</option><option>日本語</option></select></div>
          <div class="form-group"><label>每页条数</label><input class="input" type="number" value="20"></div>
        </div>
        <div class="form-group"><label>Logo URL</label><input class="input" value="/static/logo.png"></div>
      </div></div>
      <div id="tab-mail" class="tab-content"><div class="card-body">
        <div class="grid-2">
          <div class="form-group"><label>SMTP 服务器</label><input class="input" value="smtp.example.com"></div>
          <div class="form-group"><label>端口</label><input class="input" type="number" value="587"></div>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>用户名</label><input class="input" value="noreply@example.com"></div>
          <div class="form-group"><label>密码</label><input class="input" type="password" value="********"></div>
        </div>
        <div class="form-group"><label>发件人地址</label><input class="input" value="noreply@example.com"></div>
        <div><button class="btn btn-ghost btn-sm" onclick="showToast('测试邮件已发送','info')">📧 发送测试邮件</button></div>
      </div></div>
      <div id="tab-llm" class="tab-content"><div class="card-body">
        <div class="form-group"><label>LLM 提供商</label><select class="input"><option>OpenAI</option><option>Claude (Anthropic)</option><option>通义千问</option><option>DeepSeek</option></select></div>
        <div class="form-group"><label>API Key</label><input class="input" type="password" value="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"></div>
        <div class="grid-2">
          <div class="form-group"><label>模型</label><select class="input"><option>gpt-4o</option><option>gpt-4o-mini</option><option>claude-3-opus</option><option>claude-3-sonnet</option></select></div>
          <div class="form-group"><label>最大 Token</label><input class="input" type="number" value="4096"></div>
        </div>
        <div class="form-group"><label>温度</label><input class="input" type="number" value="0.3" step="0.1" min="0" max="2"></div>
      </div></div>
      <div id="tab-storage" class="tab-content"><div class="card-body">
        <div class="grid-2">
          <div class="form-group"><label>存储类型</label><select class="input"><option>本地存储</option><option>阿里云 OSS</option><option>AWS S3</option><option>腾讯云 COS</option></select></div>
          <div class="form-group"><label>存储路径</label><input class="input" value="/data/ai-hub/uploads"></div>
        </div>
        <div class="form-group"><label>文件大小限制 (MB)</label><input class="input" type="number" value="100"></div>
        <div class="form-group"><label>允许的文件类型</label><input class="input" value=".png,.jpg,.gif,.pdf,.xml,.json,.csv,.har"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="font-size:13px;color:var(--text-secondary)">已用空间：</span><span style="font-size:13px;font-weight:600;color:var(--text)">2.3 GB / 50 GB</span><div style="flex:1;height:8px;background:rgba(180,150,120,0.1);border-radius:4px;overflow:hidden"><div style="height:100%;width:4.6%;background:var(--primary);border-radius:4px"></div></div></div>
      </div></div>
    </div>
  </div>
</div>
<script>
function switchTab(el,tabId){var p=el.closest('.card');p.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});p.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});el.classList.add('active');document.getElementById(tabId).classList.add('active')}
function showToast(msg,type){type=type||'success';var t=document.createElement('div');t.className='toast toast-'+type;t.innerHTML=(type==='success'?'✅ ':'ℹ️ ')+msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}
</script>
</body>
</html>
