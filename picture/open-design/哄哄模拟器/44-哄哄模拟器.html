<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哄哄模拟器 · AI-HUB 智能工作台</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--danger:#D4745C;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:ui-monospace,'SF Mono','Fira Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px 14px;font-size:16px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-group-title{padding:12px 20px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
.menu-item{display:flex;align-items:center;padding:9px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.15s}
.menu-item:hover{background:var(--primary-bg)}.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:var(--border);font-size:12px;color:var(--text-muted)}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;height:100vh}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;flex-shrink:0;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-btn{width:32px;border-radius:6px;border:var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;height:32px}
.topbar-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sim-layout{display:flex;flex:1;overflow:hidden}
.scenario-sidebar{width:210px;background:var(--sidebar-bg);border-right:var(--border);overflow-y:auto;flex-shrink:0}
.scenario-sidebar-header{padding:14px 16px;border-bottom:var(--border);font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.scenario-list{padding:4px 0}
.scenario-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:all 0.1s}
.scenario-item:hover{background:var(--primary-bg)}.scenario-item.active{background:var(--primary-bg);border-left-color:var(--primary)}
.scenario-item .s-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.scenario-info{flex:1;min-width:0}
.scenario-name{font-size:13px;font-weight:500;color:var(--text)}.scenario-diff{font-size:11px;color:var(--text-muted);margin-top:1px}
.sim-main{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.sim-header{height:60px;border-bottom:var(--border);display:flex;align-items:center;padding:0 20px;background:var(--card-bg);gap:14px;flex-shrink:0}
.sim-char-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.sim-char-info{flex:1}
.sim-char-name{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.sim-char-state{font-size:12px;color:var(--text-muted)}
.mood-meter{display:flex;align-items:center;gap:10px;margin-top:4px}
.mood-bar{width:140px;height:6px;background:rgba(180,150,120,0.12);border-radius:3px;overflow:hidden}
.mood-fill{height:100%;border-radius:3px;transition:width 0.6s ease,background 0.4s ease}
.mood-text{font-size:11px;font-weight:600;min-width:32px}
.mood-bad{color:var(--danger)}.mood-ok{color:#B8860B}.mood-good{color:var(--success)}
.sim-score{text-align:center;padding:6px 14px;border-left:var(--border)}
.sim-score-num{font-size:22px;font-weight:700;color:var(--primary)}
.sim-score-label{font-size:10px;color:var(--text-muted)}
.sim-messages{flex:1;overflow-y:auto;padding:16px 20px}
.msg-row{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;animation:fadeIn 0.3s ease}
.msg-row.reply{flex-direction:row-reverse}
.msg-bubble{max-width:68%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;position:relative}
.msg-row:not(.reply) .msg-bubble{background:var(--card-bg);border:var(--border);border-top-left-radius:4px}
.msg-row.reply .msg-bubble{background:var(--primary);color:#fff;border-top-right-radius:4px}
.sim-input-area{background:var(--card-bg);border-top:var(--border);padding:12px 20px;flex-shrink:0}
.sim-input-row{display:flex;gap:10px;align-items:flex-end}
.sim-input{flex:1;border:var(--border);border-radius:8px;padding:10px 14px;font-size:13px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;resize:none;min-height:40px;max-height:100px}
.sim-input:focus{border-color:var(--primary)}
.send-btn{width:40px;height:40px;border-radius:8px;background:var(--primary);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s;flex-shrink:0}
.send-btn:hover{background:var(--primary-light)}
.system-msg{text-align:center;margin:10px 0;font-size:12px;color:var(--text-muted)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.goal-card{background:linear-gradient(135deg,rgba(198,123,92,0.06),rgba(212,165,116,0.06));border:1px solid rgba(198,123,92,0.15);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text-secondary);margin-bottom:10px}
.goal-card strong{color:var(--primary)}
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 30px rgba(30,20,10,0.12);display:flex;align-items:center;gap:10px;font-size:13px;animation:slideIn 0.25s ease;max-width:360px}
.toast-success{border-left:4px solid var(--success)}.toast-info{border-left:4px solid var(--info)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@media(max-width:900px){.scenario-sidebar{width:50px}.scenario-sidebar-header span:not(.s-icon),.scenario-info{display:none}.scenario-item{justify-content:center;padding:10px}}
@media(max-width:768px){
.sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:14px 0;justify-content:center}.menu-item{justify-content:center;padding:9px 0}.main{margin-left:60px}.scenario-sidebar{display:none}.msg-bubble{max-width:85%}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo" onclick="location.href='41-home-cards.html'"><div class="logo-icon">🎭</div><span>哄哄模拟器</span></div>
  <nav class="sidebar-menu">
    <div class="menu-group"><div class="menu-group-title">哄哄模拟器</div>
    <a class="menu-item active" href="44-哄哄模拟器.html"><span class="icon">🎭</span><span>哄哄模拟器</span></a>
    </div>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">哄哄模拟器 / <span>哄哄模拟器</span></div>
    <div class="topbar-right">
      <span style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px">🏆 最高分：<strong style="color:var(--primary)">92</strong></span>
      <button class="topbar-btn" onclick="resetSimulator()" title="重新开始">🔄</button>
      <button class="topbar-btn" onclick="showToast('暂无新通知','info')" title="通知">🔔</button>
      <div class="avatar-sm">张</div>
    </div>
  </header>
  <div class="sim-layout">
    <div class="scenario-sidebar">
      <div class="scenario-sidebar-header"><span class="s-icon">🎬</span><span>选择场景</span></div>
      <div class="scenario-list">
        <div class="scenario-item active" onclick="switchScenario(this,'gf')">
          <div class="s-icon" style="background:rgba(212,116,92,0.15);color:var(--danger)">💢</div>
          <div class="scenario-info"><div class="scenario-name">女朋友生气了</div><div class="scenario-diff">难度：⭐⭐⭐</div></div>
        </div>
        <div class="scenario-item" onclick="switchScenario(this,'boss')">
          <div class="s-icon" style="background:rgba(212,165,116,0.15);color:#B8860B">😤</div>
          <div class="scenario-info"><div class="scenario-name">老板不开心</div><div class="scenario-diff">难度：⭐⭐⭐⭐</div></div>
        </div>
        <div class="scenario-item" onclick="switchScenario(this,'friend')">
          <div class="s-icon" style="background:rgba(91,141,239,0.15);color:var(--info)">😢</div>
          <div class="scenario-info"><div class="scenario-name">朋友心情低落</div><div class="scenario-diff">难度：⭐⭐</div></div>
        </div>
        <div class="scenario-item" onclick="switchScenario(this,'cs')">
          <div class="s-icon" style="background:rgba(123,168,125,0.15);color:var(--success)">😩</div>
          <div class="scenario-info"><div class="scenario-name">客服被投诉</div><div class="scenario-diff">难度：⭐⭐⭐⭐⭐</div></div>
        </div>
        <div class="scenario-item" onclick="switchScenario(this,'dog')">
          <div class="s-icon" style="background:rgba(198,123,92,0.15);color:var(--primary)">🐶</div>
          <div class="scenario-info"><div class="scenario-name">宠物不开心</div><div class="scenario-diff">难度：⭐</div></div>
        </div>
      </div>
    </div>
    <div class="sim-main">
      <div class="sim-header">
        <div class="sim-char-avatar" id="charAvatar" style="background:var(--danger)">💢</div>
        <div class="sim-char-info">
          <div class="sim-char-name" id="charName">小美 <span class="tag tag-active" style="font-size:10px;background:rgba(212,116,92,0.12);color:var(--danger)">😤 正在生气</span></div>
          <div class="sim-char-state">她因为约会迟到 30 分钟没有提前通知而生气</div>
          <div class="mood-meter"><span style="font-size:11px;color:var(--text-muted)">😡 心情值</span><div class="mood-bar"><div class="mood-fill" id="moodFill" style="width:18%;background:var(--danger)"></div></div><span class="mood-text" id="moodText" style="color:var(--danger)">18%</span></div>
        </div>
        <div class="sim-score"><div class="sim-score-num" id="scoreNum">85</div><div class="sim-score-label">当前得分</div></div>
      </div>
      <div class="sim-messages" id="simMessages">
        <div class="goal-card">🎯 <strong>目标：</strong>通过沟通让她的心情值达到 80% 以上。注意语气和态度，真诚的道歉比辩解更有用！</div>
        <div class="msg-row">
          <div class="sim-char-avatar" style="background:var(--danger);width:32px;height:32px;font-size:14px">💢</div>
          <div><div class="msg-bubble">呵呵，你还知道来啊？我等了你半个小时，连个消息都没有！😤</div></div>
        </div>
      </div>
      <div class="sim-input-area">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <span style="font-size:11px;color:var(--text-muted)">💡 试试真诚道歉、解释原因、提出补偿</span>
        </div>
        <div class="sim-input-row">
          <textarea class="sim-input" id="simInput" placeholder="输入你想说的话，Enter 发送..." rows="1" onkeydown="onSimKeydown(event)"></textarea>
          <button class="send-btn" onclick="sendSimMsg()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
var mood = 18;
var score = 85;
var msgCount = 0;
var scenario = 'gf';
var completed = false;

// 场景数据和AI响应
var scenarios = {
  gf:{name:'小美',avatar:'💢',bg:'var(--danger)',state:'😤 正在生气',desc:'她因为约会迟到 30 分钟没有提前通知而生气',initialMood:18,messages:[
    '呵呵，你还知道来啊？我等了你半个小时，连个消息都没有！😤',
    '每次都是这样，你从来都不把我的时间当回事是吧？',
    '哼，你以为说句对不起就完事了？上次你也是这么说的！',
    '行吧行吧，那你倒是说说，你错在哪儿了？',
    '这还差不多...那你要怎么补偿我？😒',
    '好吧，看在你态度还算诚恳的份上，这次原谅你了。😊'
  ],tips:['先真诚道歉，不要找借口','承认错误，表示理解她的感受','提出具体的补偿方案']},
  boss:{name:'王总',avatar:'😤',bg:'#B8860B',state:'😤 很不满意',desc:'项目交付延迟两天，客户投诉到了他那里',initialMood:10,messages:[
    '小张，这个项目怎么回事？说好的 deadline 呢？',
    '客户电话都打到我这里来了，你知道我多被动吗？',
    '你们团队到底遇到了什么问题？为什么不提前说？',
    '现在说这些有什么用？客户那边你去解释？',
    '行，我给你一次机会，三天之内必须搞定。',
    '嗯，态度不错，下次有问题及时汇报。'
  ],tips:['先承认问题，表达歉意','汇报解决方案和补救措施','承诺改进流程避免再犯']},
  friend:{name:'阿杰',avatar:'😢',bg:'var(--info)',state:'😢 心情低落',desc:'他最近工作不顺，连续加班感觉被压榨',initialMood:25,messages:[
    '唉...最近真的好累，感觉快撑不住了。',
    '天天加班到半夜，周末也不让休息，工资还没涨。',
    '看着身边的人都混得不错，就我还在原地踏步。',
    '有时候真想辞职算了，但又不知道能干什么。',
    '谢谢你听我说这些...感觉好多了。',
    '你说得对，也许我该好好规划一下下一步了。😊'
  ],tips:['先倾听，表示理解和共情','肯定他的付出和价值','给予鼓励和建设性建议']},
  cs:{name:'李女士',avatar:'😩',bg:'var(--success)',state:'😩 非常不满',desc:'她购买的商品出现质量问题，售后处理拖延',initialMood:5,messages:[
    '你们这是什么服务态度？东西坏了三天了还没人管！',
    '我花了那么多钱买的，你们就这质量？',
    '别跟我扯什么流程，我现在就要解决方案！',
    '你们经理呢？让你们经理来跟我说话！',
    '这还差不多...早这样处理不就好了吗？',
    '行吧，那就按你说的办，希望别再出问题了。😤'
  ],tips:['首先诚恳道歉，安抚情绪','不推卸责任，主动提供解决方案','给予额外补偿体现诚意']},
  dog:{name:'旺财',avatar:'🐶',bg:'var(--primary)',state:'😞 闷闷不乐',desc:'它最爱的玩具球被弄丢了，一整天没精神',initialMood:30,messages:[
    '呜呜...我的球球不见了...😞',
    '我找了一整天都没找到...那可是我最喜欢的！',
    '你不懂，那个球球陪我很久了...',
    '真的吗？你要带我去买新球球？',
    '汪汪！那说好了哦，不许骗我！🐕',
    '好耶！有新球球了！你最好了！🥰'
  ],tips:['温柔安抚它的情绪','表示理解它的感受','提出带它去买新玩具']}
};

function showToast(msg,t){t=t||'success';var e=document.createElement('div');e.className='toast toast-'+t;e.innerHTML=(t==='success'?'✅ ':'ℹ️ ')+msg;document.body.appendChild(e);setTimeout(function(){e.remove()},2500);}

function switchScenario(el,key){
  document.querySelectorAll('.scenario-item').forEach(function(s){s.classList.remove('active')});
  el.classList.add('active');
  scenario = key;
  resetSimulator();
}

function resetSimulator(){
  completed = false;
  var s = scenarios[scenario];
  mood = s.initialMood;
  score = Math.max(0, Math.round(mood * 4.5));
  msgCount = 0;
  updateMood();
  document.getElementById('charAvatar').textContent = s.avatar;
  document.getElementById('charAvatar').style.background = s.bg;
  document.getElementById('charName').innerHTML = s.name + ' <span class="tag tag-active" style="font-size:10px;background:rgba(212,116,92,0.12);color:var(--danger)">' + s.state + '</span>';
  document.querySelector('.sim-char-state').textContent = s.desc;
  document.getElementById('simMessages').innerHTML =
    '<div class="goal-card">🎯 <strong>目标：</strong>通过沟通让心情值达到 80% 以上。' + s.tips.join('、') + '！</div>' +
    '<div class="msg-row"><div class="sim-char-avatar" style="background:' + s.bg + ';width:32px;height:32px;font-size:14px">' + s.avatar + '</div><div><div class="msg-bubble">' + s.messages[0] + '</div></div></div>';
  showToast('已重置：「' + s.name + '」场景','info');
}

function updateMood(){
  mood = Math.max(0, Math.min(100, mood));
  var fill = document.getElementById('moodFill');
  var text = document.getElementById('moodText');
  fill.style.width = mood + '%';
  document.getElementById('scoreNum').textContent = score;
  if (mood < 30) { fill.style.background = 'var(--danger)'; text.style.color = 'var(--danger)'; text.textContent = mood + '%'; }
  else if (mood < 60) { fill.style.background = '#B8860B'; text.style.color = '#B8860B'; text.textContent = mood + '%'; }
  else { fill.style.background = 'var(--success)'; text.style.color = 'var(--success)'; text.textContent = mood + '%'; }
}

function onSimKeydown(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendSimMsg(); }
}

function sendSimMsg(){
  if (completed) { showToast('🎉 已经通关啦！点击 🔄 重新挑战','info'); return; }
  var input = document.getElementById('simInput');
  var msg = input.value.trim();
  if (!msg) return;
  var container = document.getElementById('simMessages');
  container.insertAdjacentHTML('beforeend',
    '<div class="msg-row reply"><div style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0">我</div><div><div class="msg-bubble">' + msg.replace(/\n/g,'<br>') + '</div></div></div>');
  input.value = '';
  container.scrollTop = container.scrollHeight;
  msgCount++;
  var s = scenarios[scenario];
  var moodGain = Math.min(20, 5 + Math.round(Math.random() * 12));
  if (msg.length > 20) moodGain += 3;
  if (msg.indexOf('对不起') !== -1 || msg.indexOf('抱歉') !== -1 || msg.indexOf('道歉') !== -1) moodGain += 5;
  if (msg.indexOf('补偿') !== -1 || msg.indexOf('请') !== -1 || msg.indexOf('理解') !== -1) moodGain += 3;
  mood = Math.min(100, mood + moodGain);
  if (mood >= 80) { completed = true; score = Math.min(100, score + 5); }
  else if (moodGain > 10) score = Math.min(100, score + 2);
  updateMood();
  var idx = Math.min(msgCount, s.messages.length - 1);
  setTimeout(function(){
    container.insertAdjacentHTML('beforeend',
      '<div class="msg-row"><div class="sim-char-avatar" style="background:' + s.bg + ';width:32px;height:32px;font-size:14px">' + s.avatar + '</div><div><div class="msg-bubble">' + s.messages[idx] + '</div></div></div>');
    container.scrollTop = container.scrollHeight;
    if (completed) {
      setTimeout(function(){
        container.insertAdjacentHTML('beforeend',
          '<div style="text-align:center;padding:16px;font-size:16px;font-weight:700;color:var(--success);animation:fadeIn 0.6s ease">🎉 恭喜通关！你成功哄好了 ' + s.name + '！<br><span style="font-size:13px;font-weight:400">最终得分：' + score + ' 分</span></div>');
        container.scrollTop = container.scrollHeight;
        launchConfetti();
        showToast('🎉 通关！得分：' + score,'success');
      }, 600);
    }
  }, 600 + Math.random() * 400);
}

function launchConfetti(){
  var c = document.createElement('div'); c.className = 'confetti';
  var colors = ['#C67B5C','#D4A574','#7BA87D','#5B8DEF','#D4745C','#A07BC6','#B8860B'];
  for (var i = 0; i < 50; i++) {
    var p = document.createElement('div'); p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 1.5 + 's';
    p.style.width = (6 + Math.random() * 8) + 'px';
    p.style.height = (6 + Math.random() * 8) + 'px';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(function(){ c.remove(); }, 3500);
}
</script>
</body>
</html>
