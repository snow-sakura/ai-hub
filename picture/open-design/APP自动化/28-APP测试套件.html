<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APP测试套件 · AI-HUB 智能工作台</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--danger:#D4745C;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:ui-monospace,'SF Mono','Fira Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px 14px;font-size:16px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-group-title{padding:12px 20px 6px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
.menu-item{display:flex;align-items:center;padding:9px 20px;color:var(--text-secondary);font-size:14px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.15s}
.menu-item:hover{background:var(--primary-bg)}.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar-footer{padding:12px 20px;border-top:var(--border);font-size:12px;color:var(--text-muted)}
.main{margin-left:240px;flex:1}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-btn{width:32px;border-radius:6px;border:var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;height:32px}
.topbar-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:transparent}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.content{padding:24px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:var(--text)}.page-sub{font-size:13px;color:var(--text-muted);margin:6px 0 0}
.header-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 18px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);box-shadow:0 2px 8px rgba(198,123,92,0.25)}
.btn-secondary{background:transparent;color:var(--text-secondary);border:var(--border)}.btn-secondary:hover{background:var(--primary-bg);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid rgba(180,150,120,0.15)}.btn-ghost:hover{background:rgba(0,0,0,0.04)}
.btn-xs{height:24px;padding:0 8px;font-size:11px}
.btn-sm{height:28px;padding:0 12px;font-size:12px}
.card{background:var(--card-bg);border:var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:14px;font-weight:600;color:var(--text);border-bottom:var(--border)}
.card-body{padding:16px 20px}
.suite-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.suite-card{background:var(--card-bg);border:var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.2s}
.suite-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.suite-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.suite-info{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.suite-info strong{color:var(--text-secondary)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-active{background:rgba(123,168,125,0.12);color:var(--success)}
.tag-paused{background:rgba(212,165,116,0.12);color:#B8860B}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,20,10,0.35);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal-box{background:var(--card-bg);border-radius:14px;width:92%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(30,20,10,0.18);animation:modalIn 0.2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:var(--border)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:16px}
.modal-close:hover{background:var(--primary-bg);color:var(--text)}
.modal-body{padding:20px}.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:var(--border)}
.input{width:100%;height:34px;border:var(--border);border-radius:6px;padding:0 12px;font-size:13px;color:var(--text);font-family:inherit;background:var(--card-bg);outline:none}
.input:focus{border-color:var(--primary)}label{font-size:13px;color:var(--text-secondary);margin-bottom:4px;display:block}.mb-2{margin-bottom:12px}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:20px;right:20px;z-index:300;background:var(--card-bg);border:var(--border);border-radius:10px;padding:12px 20px;box-shadow:0 8px 30px rgba(30,20,10,0.12);display:flex;align-items:center;gap:10px;font-size:13px;animation:slideIn 0.25s ease;max-width:360px}
.toast-success{border-left:4px solid var(--success)}.toast-info{border-left:4px solid var(--info)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:900px){.suite-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:14px 0;justify-content:center}.menu-item{justify-content:center;padding:9px 0}.main{margin-left:60px}.suite-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo" onclick="location.href='41-home-cards.html'"><div class="logo-icon">📱</div><span>APP 自动化</span></div>
  <nav class="sidebar-menu">
    <div class="menu-group"><div class="menu-group-title">APP 自动化</div>
    <a class="menu-item" href="53-APP自动化模块.html"><span class="icon">📊</span><span>模块概览</span></a>
    <a class="menu-item" href="24-APP仪表盘.html"><span class="icon">📊</span><span>数据看板</span></a>
    <a class="menu-item" href="25-APP用例管理.html"><span class="icon">📋</span><span>测试用例</span></a>
    <a class="menu-item" href="26-APP元素管理.html"><span class="icon">🔧</span><span>元素管理</span></a>
    <a class="menu-item" href="27-APP录制器.html"><span class="icon">⏺️</span><span>用例录制</span></a>
    <a class="menu-item active" href="28-APP测试套件.html"><span class="icon">📦</span><span>测试套件</span></a>
    <a class="menu-item" href="29-APP执行记录.html"><span class="icon">▶️</span><span>执行记录</span></a>
    <a class="menu-item" href="30-APP测试报告.html"><span class="icon">📈</span><span>测试报告</span></a>
    <a class="menu-item" href="33-APP设备管理.html"><span class="icon">📱</span><span>设备管理</span></a>
    <a class="menu-item" href="31-APP定时任务.html"><span class="icon">⏰</span><span>定时任务</span></a>
    <a class="menu-item" href="34-APP通知.html"><span class="icon">🔔</span><span>通知配置</span></a>
    <a class="menu-item" href="32-APP环境管理.html"><span class="icon">🌐</span><span>测试环境</span></a>
    </div>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">APP 自动化 / <span>测试套件</span></div>
    <div class="topbar-right"><button class="topbar-btn" onclick="showToast('页面已刷新','info')" title="刷新">⟳</button><button class="topbar-btn" onclick="showToast('暂无新通知','info')" title="通知">🔔</button><div class="avatar-sm">张</div></div>
  </header>
  <div class="content">
    <div class="page-header fade-in">
      <div><h1 class="page-title">APP 测试套件</h1><p class="page-sub">管理移动端自动化测试集合 · 共 6 个套件</p></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="showModal('suiteModal')">+ 新建套件</button></div>
    </div>
    <div class="suite-grid fade-in" id="suiteGrid"></div>
  </div>
</div>
<div class="modal-overlay" id="suiteModal">
  <div class="modal-box">
    <div class="modal-head"><h3>📁 新建 APP 测试套件</h3><button class="modal-close" onclick="hideModal('suiteModal')">✕</button></div>
    <div class="modal-body">
      <label>套件名称</label><input class="input mb-2" placeholder="例如：登录模块回归">
      <label>关联项目</label><select class="input mb-2"><option>电商APP</option><option>金融APP</option><option>社交APP</option></select>
      <label>目标平台</label><div style="display:flex;gap:12px;margin-bottom:12px"><label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer"><input type="checkbox" checked style="accent-color:#C67B5C"> Android</label><label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer"><input type="checkbox" checked style="accent-color:#C67B5C"> iOS</label></div>
      <label>指定设备</label><select class="input"><option>全部设备</option><option>iPhone 15</option><option>Pixel 7</option><option>Galaxy S23</option></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('suiteModal')">取消</button>
      <button class="btn btn-primary" onclick="hideModal('suiteModal');showToast('套件已创建','success')">创建</button>
    </div>
  </div>
</div>
<script>
var suites = [
  {name:'登录模块回归',project:'电商APP',cases:12,devices:3,lastRun:'2026-06-12 14:00',status:'active'},
  {name:'支付流程验证',project:'金融APP',cases:8,devices:2,lastRun:'2026-06-12 11:00',status:'active'},
  {name:'注册流程冒烟',project:'电商APP',cases:6,devices:2,lastRun:'2026-06-12 09:30',status:'active'},
  {name:'首页加载性能',project:'电商APP',cases:5,devices:3,lastRun:'2026-06-11 16:00',status:'paused'},
  {name:'搜索功能验证',project:'电商APP',cases:10,devices:2,lastRun:'2026-06-10 15:00',status:'active'},
  {name:'个人中心冒烟',project:'社交APP',cases:7,devices:2,lastRun:'2026-06-09 14:00',status:'paused'}
];
function showModal(id){document.getElementById(id).classList.add('active')}
function hideModal(id){document.getElementById(id).classList.remove('active')}
document.querySelectorAll('.modal-overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')})});
function showToast(msg,type){type=type||'success';var t=document.createElement('div');t.className='toast toast-'+type;t.innerHTML=(type==='success'?'✅ ':'ℹ️ ')+msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}
var grid = document.getElementById('suiteGrid');
grid.innerHTML = suites.map(function(s){return '<div class="suite-card"><div class="suite-name">'+(s.status==='active'?'🟢':'🟡')+' '+s.name+' <span class="tag '+(s.status==='active'?'tag-active':'tag-paused')+'" style="margin-left:auto">'+(s.status==='active'?'运行中':'已暂停')+'</span></div><div class="suite-info">关联项目：<strong>'+s.project+'</strong></div><div class="suite-info">测试用例：<strong>'+s.cases+'</strong> 个 · 设备：<strong>'+s.devices+'</strong> 台</div><div class="suite-info">最后执行：<strong>'+s.lastRun+'</strong></div><div style="display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:var(--border)"><button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'编辑套件\',\'info\')">编辑</button><button class="btn btn-primary btn-xs" onclick="event.stopPropagation();showToast(\'开始执行\',\'info\')">▶ 执行</button></div></div>'}).join('');
</script>
</body>
