<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能测试 · AI-HUB</title>
<style>
:root{--primary:#C67B5C;--primary-light:#D49472;--primary-bg:rgba(198,123,92,0.08);--accent:#D4A574;--bg:#FBF7F0;--card-bg:#FFFDF9;--sidebar-bg:#F6F0E7;--text:#3D2E1F;--text-secondary:#5C4A38;--text-muted:#8B7355;--border:1px solid rgba(180,150,120,0.12);--shadow:0 4px 14px rgba(60,40,20,0.06);--success:#7BA87D;--info:#5B8DEF;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-logo{padding:16px 18px;font-size:14px;font-weight:700;color:var(--primary);border-bottom:var(--border);display:flex;align-items:center;gap:8px;cursor:pointer}
.sidebar-logo .logo-icon{width:24px;height:24px;background:var(--primary);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.sidebar-menu{flex:1;padding:4px 0;overflow-y:auto}
.menu-group-title{padding:14px 18px 6px;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.menu-item{display:flex;align-items:center;padding:8px 18px;color:var(--text-secondary);font-size:13px;cursor:pointer;border-left:3px solid transparent;text-decoration:none;gap:8px;transition:all 0.12s}
.menu-item:hover{background:var(--primary-bg)}.menu-item.active{background:var(--primary-bg);color:var(--primary);border-left-color:var(--primary);font-weight:600}
.menu-item .icon{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.menu-item .arrow{font-size:10px;color:var(--text-muted);margin-left:auto;transition:transform 0.2s}
.menu-item .arrow.open{transform:rotate(90deg)}
.sub-menu{padding-left:16px;overflow:hidden;max-height:0;transition:max-height 0.25s ease}
.sub-menu.open{max-height:200px}
.sub-item{padding:6px 18px;font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:none;display:block;border-radius:4px;transition:all 0.1s}
.sub-item:hover{color:var(--primary);background:var(--primary-bg)}
.sidebar-footer{padding:10px 18px;border-top:var(--border);font-size:11px;color:var(--text-muted)}
.main{margin-left:220px;flex:1}
.topbar{height:48px;background:var(--card-bg);border-bottom:var(--border);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:50;justify-content:space-between}
.breadcrumb{font-size:13px;color:var(--text-muted)}.breadcrumb span{color:var(--text-secondary)}
.topbar-right{display:flex;align-items:center;gap:10px}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.content{padding:24px}
.page-header{margin-bottom:20px}
.page-title{font-size:24px;font-weight:700;color:var(--text)}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:4px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border:var(--border);border-radius:10px;padding:16px 18px}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px}
.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod-entry{background:var(--card-bg);border:var(--border);border-radius:12px;padding:18px;text-decoration:none;color:inherit;transition:all 0.2s;cursor:pointer}
.mod-entry:hover{box-shadow:var(--shadow);border-color:var(--primary-light)}
.mod-entry-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.mod-entry-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.mod-entry-desc{font-size:12px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;background:var(--card-bg);color:var(--text-secondary);transition:all 0.15s}
.btn:hover{background:var(--primary-bg);color:var(--primary)}
.fade-in{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}.mod-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
.sidebar{width:60px}.sidebar-logo span,.sidebar-logo .logo-icon{margin:0 auto}.sidebar-logo span,.menu-item span:not(.icon),.menu-group-title,.sidebar-footer{display:none}.sidebar-logo{padding:12px 0;justify-content:center}.menu-item{justify-content:center;padding:8px 0}.main{margin-left:60px}.stat-card{padding:12px}.mod-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

    <a class="menu-item" href="04-AI测试报告.html"><span class="icon">📈</span><span>AI 测试报告</span></a>
  </nav>
  <div class="sidebar-footer">AI-HUB v2.0</div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="breadcrumb">AI 智能测试 / <span>模块概览</span></div>
    <div class="topbar-right"><span style="font-size:12px;color:var(--text-muted)">张明远</span><div class="avatar-sm">张</div></div>
  </header>
  <div class="content">
    <div class="page-header fade-in">
      <div class="page-title">🤖 AI 智能测试</div>
      <div class="page-sub">AI 驱动全流程智能测试 · 覆盖 3 个功能模块</div>
    </div>
    <div class="stats-row fade-in">
      <div class="stat-card"><div class="stat-value">346</div><div class="stat-label">已生成用例</div></div>
      <div class="stat-card"><div class="stat-value">128</div><div class="stat-label">AI 评审对话</div></div>
      <div class="stat-card"><div class="stat-value">24</div><div class="stat-label">测试报告</div></div>
      <div class="stat-card"><div class="stat-value">92.3%</div><div class="stat-label">用例通过率</div></div>
    </div>
    <div class="mod-grid fade-in">
      <a class="mod-entry" href="02-AI用例生成.html">
        <div class="mod-entry-icon" style="background:rgba(198,123,92,0.12);color:var(--primary)">🤖</div>
        <div class="mod-entry-name">AI 用例生成</div>
        <div class="mod-entry-desc">需求分析 → 自动生成 → AI 评审 → 修订完善</div>
      </a>
      <a class="mod-entry" href="03-AI评测师.html">
        <div class="mod-entry-icon" style="background:rgba(91,141,239,0.12);color:var(--info)">🔍</div>
        <div class="mod-entry-name">AI 评测师</div>
        <div class="mod-entry-desc">对话式评审用例，智能分析覆盖率与漏测</div>
      </a>
      <a class="mod-entry" href="04-AI测试报告.html">
        <div class="mod-entry-icon" style="background:rgba(123,168,125,0.12);color:var(--success)">📈</div>
        <div class="mod-entry-name">AI 测试报告</div>
        <div class="mod-entry-desc">自动生成统计概览、缺陷分析、改进建议</div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
